syntax = "proto3";

package harness.agent.v1;

import "harness/llm/v1/content.proto";

// AgentService is served by the local client (packages/client) to frontends:
// the desktop UI over a local socket, SSH sessions over the forwarded stdio stream, and the relay in M2.
// The Go CLI may use the client as a library instead, but it exposes the same semantics.
//
// Status: DRAFT (M0). It uses server streaming plus unary commands only (no bidi), so browsers can use it via Connect.
service AgentService {
  rpc Initialize(InitializeRequest) returns (InitializeResponse);

  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // Replays events after `after_seq`, then streams live events (history first, then live; no gaps, no duplicates).
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);

  // Sent while a turn is running, the message is queued and injected after the current tool calls (QUEUE),
  // or the turn is interrupted / backgrounded so it is read right away (NOW).
  rpc SendUserMessage(SendUserMessageRequest) returns (SendUserMessageResponse);
  // Cancels in-flight tools and generation; already completed work is kept.
  rpc Interrupt(InterruptRequest) returns (InterruptResponse);
  rpc RespondToPermission(RespondToPermissionRequest) returns (RespondToPermissionResponse);
  rpc AnswerQuestion(AnswerQuestionRequest) returns (AnswerQuestionResponse);

  rpc SetModel(SetModelRequest) returns (SetModelResponse);
  rpc SetEffort(SetEffortRequest) returns (SetEffortResponse);
  rpc SetPermissionMode(SetPermissionModeRequest) returns (SetPermissionModeResponse);

  // Fuzzy file paths for @-mentions.
  rpc SuggestFiles(SuggestFilesRequest) returns (SuggestFilesResponse);

  // Approves or rejects a plan proposed with ExitPlanMode (see PlanProposed).
  rpc RespondToPlan(RespondToPlanRequest) returns (RespondToPlanResponse);

  // Checkpoints are taken before every turn that starts from a user prompt (file tools only).
  rpc ListCheckpoints(ListCheckpointsRequest) returns (ListCheckpointsResponse);
  // Restores code and/or conversation to a checkpoint, or summarizes from / up to it.
  rpc Rewind(RewindRequest) returns (RewindResponse);
  // Compacts the conversation now (same as /compact), with optional focus instructions.
  rpc Compact(CompactRequest) returns (CompactResponse);

  // Background tasks: shell commands started with run_in_background or moved to the background.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc StopTask(StopTaskRequest) returns (StopTaskResponse);

  // Ends the session process-side (kills background tasks, flushes the transcript).
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
}

enum PermissionMode {
  PERMISSION_MODE_UNSPECIFIED = 0; // same as DEFAULT
  PERMISSION_MODE_DEFAULT = 1;
  PERMISSION_MODE_ACCEPT_EDITS = 2;
  PERMISSION_MODE_PLAN = 3;
  PERMISSION_MODE_DONT_ASK = 4;
  PERMISSION_MODE_BYPASS_PERMISSIONS = 5;
  // Tool calls that would prompt are decided by harness.decision.v1.DecisionService (local rules as fallback).
  PERMISSION_MODE_AUTO = 6;
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_IDLE = 1;
  SESSION_STATUS_WORKING = 2;
  // Waiting for a permission decision or a question answer.
  SESSION_STATUS_NEEDS_INPUT = 3;
  SESSION_STATUS_WAITING_FOR_CONNECTION = 4;
  SESSION_STATUS_ERROR = 5;
}

message InitializeRequest {
  string frontend = 1; // "cli", "desktop", "web", ...
  string frontend_version = 2;
}

message InitializeResponse {
  string client_version = 1;
  string user_email = 2;
  repeated string model_ids = 3;
}

message SessionInfo {
  string id = 1;
  string title = 2;
  string cwd = 3;
  string git_branch = 4;
  string model = 5;
  PermissionMode permission_mode = 6;
  SessionStatus status = 7;
  // RFC 3339, UTC.
  string updated_at = 8;
  // Normalized git remote ("github.com/xlsft/harness", see harness.common.v1.Scope for the rules);
  // empty outside a repository.
  string repo = 9;
  // dev_... of the machine running the session, and its display name.
  string device_id = 10;
  string device_name = 11;
  DiffStats diff_stats = 12;
  // Absent when no PR is linked.
  optional PullRequest pull_request = 13;
  bool archived = 14;
  bool pinned = 15;
  // Set for forks and /branch.
  string parent_session_id = 16;
}

message DiffStats {
  int32 files_changed = 1;
  int32 additions = 2;
  int32 deletions = 3;
}

message PullRequest {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_OPEN = 1;
    STATE_DRAFT = 2;
    STATE_MERGED = 3;
    STATE_CLOSED = 4;
  }
  string url = 1;
  int32 number = 2;
  State state = 3;
}

message CreateSessionRequest {
  string cwd = 1;
  string model = 2;
  PermissionMode permission_mode = 3;
  // Resume an existing session instead of starting a new one.
  string resume_session_id = 4;
  // With resume_session_id: copy the transcript into a new session.
  bool fork = 5;
  harness.llm.v1.Effort effort = 6;
  // Permission rules in Claude Code syntax, e.g. "Bash(npm run test *)", "Edit(/src/**)".
  repeated string allowed_tools = 7;
  repeated string disallowed_tools = 8;
  // Maximum tool-use round trips per turn; 0 means unlimited.
  int32 max_turns = 9;
  // Extra working directories (like --add-dir).
  repeated string additional_directories = 10;
  // With fork: fork at this checkpoint instead of the end of the transcript.
  string fork_at_checkpoint_id = 11;
}

message CreateSessionResponse {
  SessionInfo session = 1;
}

message ListSessionsRequest {
  string cwd = 1;
}

message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
}

message SubscribeRequest {
  string session_id = 1;
  int64 after_seq = 2;
}

message SubscribeResponse {
  SessionEvent event = 1;
}

message SessionEvent {
  int64 seq = 1;
  string session_id = 2;
  // RFC 3339, UTC.
  string timestamp = 3;
  oneof event {
    SessionInfo session_updated = 4;
    UserMessage user_message = 5;
    AssistantDelta assistant_delta = 6;
    AssistantMessage assistant_message = 7;
    ToolCallStarted tool_call_started = 8;
    ToolCallFinished tool_call_finished = 9;
    PermissionRequest permission_request = 10;
    Question question = 11;
    QueueChanged queue_changed = 12;
    TurnFinished turn_finished = 13;
    Notice notice = 14;
    PermissionResolved permission_resolved = 15;
    QuestionResolved question_resolved = 16;
    SessionEnded session_ended = 17;
    TurnStarted turn_started = 18;
    TodosUpdated todos_updated = 19;
    PlanProposed plan_proposed = 20;
    PlanResolved plan_resolved = 21;
    TaskStarted task_started = 22;
    TaskOutput task_output = 23;
    TaskFinished task_finished = 24;
    CheckpointCreated checkpoint_created = 25;
    Rewound rewound = 26;
    Compacted compacted = 27;
    PermissionModeChanged permission_mode_changed = 28;
  }
}

message TurnStarted {
  // UUID of the user message that started the turn.
  string user_message_uuid = 1;
  string model = 2;
}

// Full replacement of the session's todo list (TodoWrite semantics).
message TodosUpdated {
  repeated Todo todos = 1;
}

message Todo {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_PENDING = 1;
    STATUS_IN_PROGRESS = 2;
    STATUS_COMPLETED = 3;
  }
  string content = 1;
  // Present-tense form shown while in progress, e.g. "Running tests".
  string active_form = 2;
  Status status = 3;
}

// Emitted when the model calls ExitPlanMode. The turn waits for RespondToPlan.
message PlanProposed {
  string request_id = 1;
  string tool_use_id = 2;
  // Markdown.
  string plan = 3;
  // Where the plan was written (inside the session's plans directory).
  string plan_file_path = 4;
}

message PlanResolved {
  string request_id = 1;
  RespondToPlanRequest.Decision decision = 2;
  string resolved_by = 3;
}

message TaskStarted {
  string task_id = 1;
  // Tool use that started it.
  string tool_use_id = 2;
  string command = 3;
  string description = 4;
  // File the output is streamed to; the model reads it with Read.
  string output_path = 5;
}

// Throttled tail of a background task's output (for the tasks pane); the full output is in output_path.
message TaskOutput {
  string task_id = 1;
  string text = 2;
}

message TaskFinished {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_EXITED = 1;
    REASON_STOPPED = 2;
    REASON_TIME_LIMIT = 3;
    REASON_SESSION_CLOSED = 4;
  }
  string task_id = 1;
  Reason reason = 2;
  int32 exit_code = 3;
  int64 duration_ms = 4;
}

message Checkpoint {
  string id = 1;
  // UUID of the user message that started the turn.
  string user_message_uuid = 2;
  // First line of that prompt, for the rewind menu.
  string prompt_preview = 3;
  // RFC 3339, UTC.
  string created_at = 4;
  // Whether any tracked file changed after this checkpoint (controls "restore code" options).
  bool has_code_changes = 5;
}

message CheckpointCreated {
  Checkpoint checkpoint = 1;
}

message Rewound {
  string checkpoint_id = 1;
  RewindRequest.Mode mode = 2;
  // Files restored and files skipped (symlinks, hardlinks, missing snapshots).
  int32 files_restored = 3;
  int32 files_skipped = 4;
  // Prompt to put back into the input box (Restore conversation / Summarize from here).
  string restored_prompt = 5;
}

message Compacted {
  enum Trigger {
    TRIGGER_UNSPECIFIED = 0;
    TRIGGER_MANUAL = 1;
    TRIGGER_AUTO = 2;
    TRIGGER_REWIND = 3;
  }
  Trigger trigger = 1;
  int64 tokens_before = 2;
  int64 tokens_after = 3;
}

message PermissionModeChanged {
  PermissionMode mode = 1;
}

message UserMessage {
  string uuid = 1;
  repeated harness.llm.v1.ContentBlock content = 2;
}

// Streaming fragment of the assistant message `message_id`.
// Deltas are ephemeral: they are never persisted (neither in the local log nor on the relay) and never
// replayed. A delta does not consume a seq; its SessionEvent.seq is the seq of the last durable event
// emitted before it, so it sorts after that event and before the next durable one. Consumers must not use
// seq to deduplicate deltas. History replay yields only the final AssistantMessage.
message AssistantDelta {
  string message_id = 1;
  int32 index = 2;
  oneof delta {
    string text = 3;
    string thinking = 4;
    string input_json = 5;
  }
}

// The complete assistant message, emitted once its stream ends.
message AssistantMessage {
  string message_id = 1;
  string model = 2;
  repeated harness.llm.v1.ContentBlock content = 3;
  harness.llm.v1.StopReason stop_reason = 4;
  harness.llm.v1.Usage usage = 5;
}

message ToolCallStarted {
  string tool_use_id = 1;
  string name = 2;
  string input_json = 3;
  // Short human-readable summary for collapsed rendering, e.g. "Read src/main.go".
  string summary = 4;
}

message ToolCallFinished {
  string tool_use_id = 1;
  bool is_error = 2;
  bool interrupted = 3;
  repeated harness.llm.v1.ContentBlock content = 4;
  int64 duration_ms = 5;
  // Structured result for rich rendering (Claude Code's toolUseResult shape), e.g.
  // Read: {"file":{"filePath","numLines","totalLines"}}, Bash: {"stdout","stderr","interrupted"},
  // Edit/Write: {"filePath","structuredPatch":[...]}.
  string structured_result_json = 6;
  // Short human-readable summary for collapsed rendering, e.g. "Read 42 lines".
  string summary = 7;
}

message PermissionRequest {
  string request_id = 1;
  string tool_use_id = 2;
  string tool_name = 3;
  string input_json = 4;
  // Rule the user may choose to always allow, e.g. "Bash(npm run test *)".
  repeated string suggested_rules = 5;
  string reason = 6;
}

// A pending PermissionRequest was answered (by any client, or by a hook / rule). Frontends dismiss the card.
message PermissionResolved {
  string request_id = 1;
  RespondToPermissionRequest.Decision decision = 2;
  // Who answered: "local", "relay:<frontend>", "hook", "rule", "interrupt".
  string resolved_by = 3;
}

// A pending Question was answered (or cancelled). Frontends dismiss the card.
message QuestionResolved {
  string request_id = 1;
  string resolved_by = 2;
}

// The session ended on its host; no more events follow (a resume creates a new subscription).
message SessionEnded {
  // e.g. "exit", "killed", "host_shutdown", "superseded".
  string reason = 1;
}

message Question {
  string request_id = 1;
  string tool_use_id = 2;
  repeated QuestionItem items = 3;
}

message QuestionItem {
  string question = 1;
  string header = 2;
  bool multi_select = 3;
  repeated QuestionOption options = 4;
}

message QuestionOption {
  string label = 1;
  string description = 2;
}

message QueueChanged {
  repeated UserMessage queued = 1;
}

message TurnFinished {
  enum Result {
    RESULT_UNSPECIFIED = 0;
    RESULT_SUCCESS = 1;
    RESULT_INTERRUPTED = 2;
    RESULT_ERROR_MAX_TURNS = 3;
    RESULT_ERROR_DURING_EXECUTION = 4;
  }
  Result result = 1;
  int32 num_turns = 2;
  harness.llm.v1.Usage usage = 3;
  double cost_usd = 4;
  int64 duration_ms = 5;
  string error_message = 6;
}

message Notice {
  enum Level {
    LEVEL_UNSPECIFIED = 0;
    LEVEL_INFO = 1;
    LEVEL_WARNING = 2;
    LEVEL_ERROR = 3;
  }
  Level level = 1;
  // e.g. "retry", "compacted", "connection_lost".
  string kind = 2;
  string text = 3;
}

message SendUserMessageRequest {
  enum Delivery {
    DELIVERY_UNSPECIFIED = 0; // same as QUEUE
    DELIVERY_QUEUE = 1;
    DELIVERY_NOW = 2;
  }
  string session_id = 1;
  // Client-generated id used for deduplication.
  string uuid = 2;
  repeated harness.llm.v1.ContentBlock content = 3;
  Delivery delivery = 4;
}

message SendUserMessageResponse {}

message InterruptRequest {
  string session_id = 1;
}

message InterruptResponse {}

message RespondToPermissionRequest {
  enum Decision {
    DECISION_UNSPECIFIED = 0;
    DECISION_ALLOW = 1;
    // Allow and persist `rule` to .claude/settings.local.json.
    DECISION_ALLOW_ALWAYS = 2;
    // With a comment the model continues; without one the turn stops.
    DECISION_DENY = 3;
  }
  string session_id = 1;
  string request_id = 2;
  Decision decision = 3;
  string rule = 4;
  // Passed to the model with the result (allow) or as the denial reason (deny).
  string comment = 5;
  // Optional user-edited tool input.
  string updated_input_json = 6;
}

message RespondToPermissionResponse {}

message AnswerQuestionRequest {
  string session_id = 1;
  string request_id = 2;
  // One entry per question, in order; labels of the chosen options or free text.
  repeated QuestionAnswer answers = 3;
}

message QuestionAnswer {
  repeated string selected = 1;
}

message AnswerQuestionResponse {}

message SetModelRequest {
  string session_id = 1;
  string model = 2;
}

message SetModelResponse {}

message SetEffortRequest {
  string session_id = 1;
  harness.llm.v1.Effort effort = 2;
}

message SetEffortResponse {}

message SetPermissionModeRequest {
  string session_id = 1;
  PermissionMode mode = 2;
}

message SetPermissionModeResponse {}

message SuggestFilesRequest {
  string session_id = 1;
  string query = 2;
  int32 limit = 3;
}

message SuggestFilesResponse {
  repeated string paths = 1;
}

message RespondToPlanRequest {
  enum Decision {
    DECISION_UNSPECIFIED = 0;
    // Approve and switch to acceptEdits.
    DECISION_APPROVE_ACCEPT_EDITS = 1;
    // Approve and keep asking for each edit (default mode).
    DECISION_APPROVE_MANUAL = 2;
    // Keep planning; feedback is sent to the model.
    DECISION_KEEP_PLANNING = 3;
  }
  string session_id = 1;
  string request_id = 2;
  Decision decision = 3;
  string feedback = 4;
}

message RespondToPlanResponse {}

message ListCheckpointsRequest {
  string session_id = 1;
}

message ListCheckpointsResponse {
  repeated Checkpoint checkpoints = 1;
}

message RewindRequest {
  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_CODE_AND_CONVERSATION = 1;
    MODE_CONVERSATION = 2;
    MODE_CODE = 3;
    // Targeted compaction of everything after the checkpoint; files untouched.
    MODE_SUMMARIZE_FROM = 4;
    // Targeted compaction of everything before the checkpoint; files untouched.
    MODE_SUMMARIZE_UP_TO = 5;
  }
  string session_id = 1;
  string checkpoint_id = 2;
  Mode mode = 3;
  // Optional extra instructions for the summary modes.
  string summary_instructions = 4;
}

message RewindResponse {
  Rewound result = 1;
}

message CompactRequest {
  string session_id = 1;
  string instructions = 2;
}

message CompactResponse {}

message BackgroundTask {
  string task_id = 1;
  string command = 2;
  string description = 3;
  string output_path = 4;
  bool running = 5;
  int32 exit_code = 6;
  // RFC 3339, UTC.
  string started_at = 7;
}

message ListTasksRequest {
  string session_id = 1;
}

message ListTasksResponse {
  repeated BackgroundTask tasks = 1;
}

message StopTaskRequest {
  string session_id = 1;
  string task_id = 2;
}

message StopTaskResponse {}

message CloseSessionRequest {
  string session_id = 1;
}

message CloseSessionResponse {}
