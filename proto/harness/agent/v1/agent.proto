syntax = "proto3";

package harness.agent.v1;

import "harness/agent/v1/files.proto";
import "harness/agent/v1/limits.proto";
import "harness/agent/v1/shell.proto";
import "harness/agent/v1/sidechat.proto";
import "harness/agent/v1/terminal.proto";
import "harness/llm/v1/content.proto";

// AgentService is served by the local client (packages/client) to frontends:
// the desktop UI over a local socket, SSH sessions over the forwarded stdio stream, and the relay in M2.
// The Go CLI may use the client as a library instead, but it exposes the same semantics.
//
// Status: DRAFT (M0). It uses server streaming plus unary commands only (no bidi), so browsers can use it via Connect.
service AgentService {
  rpc Initialize(InitializeRequest) returns (InitializeResponse);

  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  // Sessions on this machine (local transcripts and live sessions) with the per-user state stored on the harness
  // server (pinned, unread, archived, renamed title), plus the user's sessions of other machines listed from the
  // server (SessionInfo.remote, with their device and, when known, its relay presence). A session the server
  // lists that is also on this machine appears once, as local. Archived sessions are left out unless
  // include_archived.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // Changes the per-user state of a session: pin, unread, archive (which also stops it), or a rename. The state is
  // stored on the harness server (SyncService), for remote sessions too; without a server connection only a rename
  // can be applied (FAILED_PRECONDITION for the rest), and when the server is unreachable nothing is changed
  // (UNAVAILABLE).
  rpc UpdateSession(UpdateSessionRequest) returns (UpdateSessionResponse);
  // Deletes a session for good: stops it if live, deletes its server copy and its local transcript files (a
  // remote session: its server copy only). When the server is unreachable nothing is deleted (UNAVAILABLE).
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);

  // --- New-session pickers (folder, branch, worktree) ---
  // Folders recently used for sessions on this machine, most recent first.
  rpc ListRecentFolders(ListRecentFoldersRequest) returns (ListRecentFoldersResponse);
  // Subdirectories of a folder, for an "Open folder…" browser. Hidden entries are left out unless asked.
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);
  // Local branches of the repository containing `cwd` (empty outside a repository).
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse);

  // Replays events after `after_seq`, then streams live events (history first, then live; no gaps, no duplicates).
  // With `control`, the stream also carries control messages (SubscribeResponse without an event): one before
  // the replay and one right after it (with the session as it is now), then a heartbeat every 15 seconds; a
  // frontend that hears nothing for much longer treats the stream as dead and subscribes again.
  // A remote session (SessionInfo.remote) is followed live through the relay when it is remote_controllable;
  // otherwise its durable transcript is read from the harness server and replayed, and the stream then ends.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);

  // Sent while a turn is running, the message is queued and injected after the current tool calls (QUEUE),
  // or the turn is interrupted / backgrounded so it is read right away (NOW).
  rpc SendUserMessage(SendUserMessageRequest) returns (SendUserMessageResponse);
  // Takes back a message that is still queued (by its uuid); a QueueChanged event follows.
  // removed = false when it was already injected into the turn.
  rpc RemoveQueuedMessage(RemoveQueuedMessageRequest) returns (RemoveQueuedMessageResponse);
  // Cancels in-flight tools and generation; already completed work is kept. With no turn running it reports
  // idle and publishes SessionUpdated, so a frontend that missed the end of a turn catches up.
  rpc Interrupt(InterruptRequest) returns (InterruptResponse);
  rpc RespondToPermission(RespondToPermissionRequest) returns (RespondToPermissionResponse);
  rpc AnswerQuestion(AnswerQuestionRequest) returns (AnswerQuestionResponse);

  rpc SetModel(SetModelRequest) returns (SetModelResponse);
  rpc SetEffort(SetEffortRequest) returns (SetEffortResponse);
  rpc SetPermissionMode(SetPermissionModeRequest) returns (SetPermissionModeResponse);
  // Switches the output style (built-in id, or a user/project style name); "default" clears it.
  rpc SetOutputStyle(SetOutputStyleRequest) returns (SetOutputStyleResponse);
  // Built-in, user and project output styles available to this session.
  rpc ListOutputStyles(ListOutputStylesRequest) returns (ListOutputStylesResponse);

  // Fuzzy file paths for @-mentions.
  rpc SuggestFiles(SuggestFilesRequest) returns (SuggestFilesResponse);

  // Approves or rejects a plan proposed with ExitPlanMode (see PlanProposed).
  rpc RespondToPlan(RespondToPlanRequest) returns (RespondToPlanResponse);

  // Checkpoints are taken before every turn that starts from a user prompt (file tools only).
  rpc ListCheckpoints(ListCheckpointsRequest) returns (ListCheckpointsResponse);
  // Restores code and/or conversation to a checkpoint, or summarizes from / up to it.
  rpc Rewind(RewindRequest) returns (RewindResponse);
  // Compacts the conversation now (same as /compact), with optional focus instructions.
  rpc Compact(CompactRequest) returns (CompactResponse);
  // What fills the session's context window, by category (see ContextUsage). Computed on demand: frontends
  // ask when a context view opens and again after turns while it stays open. Local sessions only.
  rpc GetContextUsage(GetContextUsageRequest) returns (GetContextUsageResponse);

  // Per-user preferences that the client honours for every session (stored in the user's synced settings
  // document). Without a server connection Get returns the defaults and Update fails with FAILED_PRECONDITION.
  rpc GetUserPreferences(GetUserPreferencesRequest) returns (GetUserPreferencesResponse);
  rpc UpdateUserPreferences(UpdateUserPreferencesRequest) returns (UpdateUserPreferencesResponse);

  // Background tasks: shell commands started with run_in_background or moved to the background.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc StopTask(StopTaskRequest) returns (StopTaskResponse);

  // Ends the session process-side (kills background tasks, flushes the transcript).
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);

  // Workspace trust (~/.harness/trust.json): project hooks, .mcp.json servers and allow rules from
  // committed settings apply only in trusted folders. Frontends ask before the first session in a folder.
  rpc GetWorkspaceTrust(GetWorkspaceTrustRequest) returns (GetWorkspaceTrustResponse);
  rpc SetWorkspaceTrust(SetWorkspaceTrustRequest) returns (SetWorkspaceTrustResponse);

  // Terminals (terminal.proto): shells in a PTY, with I/O over a WebSocket authenticated by one-time tickets.
  // CreateTerminal starts one and returns a ticket; AttachTerminal returns a fresh ticket to reconnect.
  rpc CreateTerminal(CreateTerminalRequest) returns (CreateTerminalResponse);
  rpc AttachTerminal(AttachTerminalRequest) returns (AttachTerminalResponse);
  rpc ListTerminals(ListTerminalsRequest) returns (ListTerminalsResponse);
  // Ends the shell (if still running) and forgets the terminal.
  rpc KillTerminal(KillTerminalRequest) returns (KillTerminalResponse);
  rpc ResizeTerminal(ResizeTerminalRequest) returns (ResizeTerminalResponse);

  // --- Environments (packages/client/server/environment.go) ---
  // An environment belongs to a primary folder (project) and is stored on this machine under HARNESS_HOME,
  // keyed by the folder's absolute path: a name, additional folders, new-session defaults (worktree, base
  // branch) and environment variables in .env syntax. Sessions started in the folder use it: the additional
  // folders become working directories and the variables are set for shell commands, background tasks and the
  // other processes tools spawn. The variables are encrypted at rest (see Environment.env).
  //
  // Returns the environment of a folder, or of a session's primary folder. A folder without one returns the
  // defaults (exists = false). A remote session's environment lives on its machine: read_only, nothing else set.
  rpc GetEnvironment(GetEnvironmentRequest) returns (GetEnvironmentResponse);
  // Replaces the environment of a folder and applies it to the open sessions in that folder from their next tool
  // call: working directories and environment variables change live; worktree and base branch only affect new
  // sessions; MCP servers already started keep their environment. Invalid .env text fails with
  // INVALID_ARGUMENT and an EnvironmentErrors detail (line numbers). A remote session is refused
  // (FAILED_PRECONDITION).
  rpc UpdateEnvironment(UpdateEnvironmentRequest) returns (UpdateEnvironmentResponse);
  // Git facts of a folder for its menu: repository root, current and default branch, and the remote as a
  // browsable URL ("Open repository on GitHub").
  rpc GetFolderInfo(GetFolderInfoRequest) returns (GetFolderInfoResponse);
  // Moves an idle session to another primary folder. The conversation is kept (same session id, the transcript
  // moves to the new folder's project directory); the tools start over in the new folder: the live session is
  // closed (SessionEnded reason "folder_changed": background tasks stop, the shell cwd resets) and reopened
  // with the new folder's settings, permissions, instructions, MCP servers and environment. Subscribers
  // subscribe again (after_seq = 0). FAILED_PRECONDITION while a turn runs, for a session in a harness worktree
  // and for remote sessions.
  rpc SetSessionFolder(SetSessionFolderRequest) returns (SetSessionFolderResponse);
  // Adds a working directory to an open session's environment (stored) and applies it to the open sessions
  // in that folder, this one included, from their next tool call. FAILED_PRECONDITION for remote sessions.
  rpc AddSessionDirectory(AddSessionDirectoryRequest) returns (AddSessionDirectoryResponse);

  // --- Files (files.proto, packages/client/server/filebrowser.go) ---
  // The files pane: a session's working directories, their listings with git status and .gitignore marks, file
  // contents within limits, and the repository's changed paths. Paths must stay inside the working directories
  // (PERMISSION_DENIED otherwise); sessions of other machines are FAILED_PRECONDITION.
  rpc ListFileRoots(ListFileRootsRequest) returns (ListFileRootsResponse);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc GetGitStatus(GetGitStatusRequest) returns (GetGitStatusResponse);
  // --- User shell commands (shell.proto) ---
  // Runs a command from the composer's shell mode in the session's shell, without the model and without a
  // permission prompt, at once (also while a turn runs). Returns when it started; UserShellStarted / Output /
  // Finished events follow, and the result reaches the model on its next request. FAILED_PRECONDITION for
  // remote sessions.
  rpc RunShellCommand(RunShellCommandRequest) returns (RunShellCommandResponse);
  // Kills a running user shell command (UserShellFinished reason STOPPED). NOT_FOUND when it is not running.
  rpc StopShellCommand(StopShellCommandRequest) returns (StopShellCommandResponse);
  // Side chats (sidechat.proto): read-only conversations next to a session that see its conversation but never
  // change it (no tools). Stored next to the session's transcript. Local open sessions only.
  rpc ListSideChats(ListSideChatsRequest) returns (ListSideChatsResponse);
  rpc CreateSideChat(CreateSideChatRequest) returns (CreateSideChatResponse);
  // The side chat with its messages.
  rpc GetSideChat(GetSideChatRequest) returns (GetSideChatResponse);
  // Renames it or changes its model / effort (remembered for this side chat only).
  rpc UpdateSideChat(UpdateSideChatRequest) returns (UpdateSideChatResponse);
  // Stops a running answer and deletes the side chat.
  rpc DeleteSideChat(DeleteSideChatRequest) returns (DeleteSideChatResponse);
  // Asks a question: streams the stored question, the answer's text deltas and the stored answer with usage.
  // Cancelling the stream stops the answer like StopSideChat.
  rpc AskSideChat(AskSideChatRequest) returns (stream AskSideChatResponse);
  // Stops the running answer of a side chat; the text so far is kept (stopped = true).
  rpc StopSideChat(StopSideChatRequest) returns (StopSideChatResponse);
  // Provider limits (limits.proto): balances, monthly spend and rate-limit windows of the LLM providers the user
  // may see, from the server (harness.llm.v1.ProviderLimitsService). UNAVAILABLE without a server.
  rpc GetProviderLimits(GetProviderLimitsRequest) returns (GetProviderLimitsResponse);
}

enum PermissionMode {
  PERMISSION_MODE_UNSPECIFIED = 0; // same as DEFAULT
  PERMISSION_MODE_DEFAULT = 1;
  PERMISSION_MODE_ACCEPT_EDITS = 2;
  PERMISSION_MODE_PLAN = 3;
  PERMISSION_MODE_DONT_ASK = 4;
  PERMISSION_MODE_BYPASS_PERMISSIONS = 5;
  // Tool calls that would prompt are decided by harness.decision.v1.DecisionService (local rules as fallback).
  PERMISSION_MODE_AUTO = 6;
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_IDLE = 1;
  SESSION_STATUS_WORKING = 2;
  // Waiting for a permission decision or a question answer.
  SESSION_STATUS_NEEDS_INPUT = 3;
  SESSION_STATUS_WAITING_FOR_CONNECTION = 4;
  SESSION_STATUS_ERROR = 5;
}

message InitializeRequest {
  string frontend = 1; // "cli", "desktop", "web", ...
  string frontend_version = 2;
}

message InitializeResponse {
  string client_version = 1;
  string user_email = 2;
  repeated string model_ids = 3;
  // Permission modes this client supports, in Shift+Tab cycle order, without the ones the server's policy
  // disables (harness.auth.v1.AdminService.SetPermissionModePolicy).
  repeated PermissionMode permission_modes = 4;
  // The server's model catalog, in its order (model_ids lists the same ids).
  repeated ModelInfo models = 5;
  // The server's default model for sessions (its "main" slot); empty when not configured.
  string default_model = 6;
  // Modes the server's policy disables (also those outside the cycle, e.g. bypass): frontends do not offer
  // them, and CreateSession / SetPermissionMode with one fail with PERMISSION_DENIED. Read again after a
  // while: the policy can change while the client runs.
  repeated PermissionMode disabled_permission_modes = 7;
  // Base URL of a web UI that opens this user's sessions: "<web_url>/?session=<id>" opens a session (the UI's
  // session query parameter). Empty when none is configured (HARNESS_WEB_URL on the client); the harness
  // server does not serve the UI yet.
  string web_url = 8;
}

// A model from the server's catalog, with what frontends need to offer it.
message ModelInfo {
  string id = 1;
  string display_name = 2;
  // Provider id, for grouping.
  string provider = 3;
  int64 context_window = 4;
  bool thinking = 5;
  // Effort levels the model supports, lowest first; empty means effort is not supported.
  repeated harness.llm.v1.Effort efforts = 6;
  bool images = 7;
  // USD per 1M tokens; absent when the server has no prices configured.
  optional double input_price = 8;
  optional double output_price = 9;
}

message SessionInfo {
  string id = 1;
  string title = 2;
  string cwd = 3;
  string git_branch = 4;
  string model = 5;
  PermissionMode permission_mode = 6;
  SessionStatus status = 7;
  // RFC 3339, UTC.
  string updated_at = 8;
  // Normalized git remote ("github.com/xlsft/harness", see harness.common.v1.Scope for the rules);
  // empty outside a repository.
  string repo = 9;
  // dev_... of the machine running the session, and its display name.
  string device_id = 10;
  string device_name = 11;
  DiffStats diff_stats = 12;
  // Absent when no PR is linked.
  optional PullRequest pull_request = 13;
  // Per-user state, stored on the harness server: hidden from the default session list.
  bool archived = 14;
  bool pinned = 15;
  // Set for forks and /branch: the session it was forked from. Frontends list such a sub-session under its
  // parent. Cleared by UpdateSessionRequest.detach_from_parent.
  string parent_session_id = 16;
  // Active output style id or name ("default" when none).
  string output_style = 17;
  // Set when the session runs in a git worktree the client created for it (CreateSessionRequest.worktree).
  optional Worktree worktree = 18;
  // Per-user state, stored on the harness server: a turn finished while the session was not open in a frontend.
  bool unread = 19;
  // Set by the local client (AgentService.ListSessions) for a session of the user that belongs to another machine:
  // it is listed from the harness server, device_id / device_name name its machine, its transcript is read-only
  // here, and commands reach it only through the relay (remote_controllable). Never stored on the server.
  bool remote = 20;
  // Remote sessions only: whether the session's machine is connected to the harness server's relay right now.
  // Absent when unknown (remote control is off on this client, or the server could not be asked).
  optional bool device_online = 21;
  // Remote sessions only: the session is open on its machine, which is online, so it can be driven through the
  // relay (Subscribe follows it live and commands are forwarded).
  bool remote_controllable = 22;
  // The session was started without a folder (CreateSessionRequest.cwd empty): `cwd` is a private working
  // directory the client created for it (HARNESS_HOME/chats/<session id>, not a repository, no project
  // settings, instructions or MCP servers). Frontends show "No folder" instead of the path; the directory is
  // removed with the session.
  bool no_folder = 23;
}

// A git worktree a session runs in. `cwd` of the session is inside `path`.
message Worktree {
  // Absolute path of the worktree checkout.
  string path = 1;
  // Branch checked out in the worktree.
  string branch = 2;
  // The ref the branch was created from (a branch name or commit).
  string base_ref = 3;
  // The repository's main checkout the worktree belongs to.
  string repository_path = 4;
}

message DiffStats {
  int32 files_changed = 1;
  int32 additions = 2;
  int32 deletions = 3;
}

message PullRequest {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_OPEN = 1;
    STATE_DRAFT = 2;
    STATE_MERGED = 3;
    STATE_CLOSED = 4;
  }
  string url = 1;
  int32 number = 2;
  State state = 3;
}

message CreateSessionRequest {
  // The session's folder. Empty starts a session without a folder (SessionInfo.no_folder): the client creates a
  // private working directory for it, HARNESS_HOME/chats/<session id> (0700). Its environment (GetEnvironment,
  // UpdateEnvironment) is keyed by that directory, so it is per-session. With resume_session_id and no fork,
  // empty resumes the session in its recorded folder; a fork of a folderless session (or a fork with empty cwd)
  // gets its own private directory, seeded with a copy of the parent's files when the parent had one.
  // Cannot be empty together with worktree.
  string cwd = 1;
  string model = 2;
  PermissionMode permission_mode = 3;
  // Resume an existing session instead of starting a new one.
  string resume_session_id = 4;
  // With resume_session_id: copy the transcript into a new session. A remote session (SessionInfo.remote) can
  // only be forked: its transcript is downloaded from the harness server into a new local session in `cwd`.
  bool fork = 5;
  harness.llm.v1.Effort effort = 6;
  // Permission rules in Claude Code syntax, e.g. "Bash(npm run test *)", "Edit(/src/**)".
  repeated string allowed_tools = 7;
  repeated string disallowed_tools = 8;
  // Maximum tool-use round trips per turn; 0 means unlimited.
  int32 max_turns = 9;
  // Extra working directories (like --add-dir).
  repeated string additional_directories = 10;
  // With fork: fork at this checkpoint instead of the end of the transcript. Any UserMessage.uuid of the
  // transcript works (a checkpoint id is the uuid of the prompt that started its turn): the fork holds the
  // conversation before that message. A fork is titled "<parent title> (fork)".
  string fork_at_checkpoint_id = 11;
  // Run the session in a new git worktree of the repository containing `cwd`. The client creates it under
  // <repository>/.harness/worktrees/<name> (git-ignored) on a new branch, and the session's cwd becomes the
  // matching directory inside it. Fails with FAILED_PRECONDITION outside a git repository.
  optional WorktreeOptions worktree = 12;
}

message WorktreeOptions {
  // Name of the worktree directory and of the branch suffix; the client derives one (adjective-noun-xxxx)
  // when empty. Must be a single path segment.
  string name = 1;
  // New branch to create; default "harness/<name>". An existing branch is checked out instead when it is not
  // checked out anywhere else.
  string branch = 2;
  // Where the new branch starts; default the current HEAD of the repository.
  string base_ref = 3;
}

message ListRecentFoldersRequest {
  // 0 = client default (20).
  int32 limit = 1;
}

message ListRecentFoldersResponse {
  repeated RecentFolder folders = 1;
}

message RecentFolder {
  // Absolute path.
  string path = 1;
  // Display name (the last path segment, or the repository name).
  string name = 2;
  // Current branch, when a git repository.
  string git_branch = 3;
  // Normalized git remote, when known.
  string repo = 4;
  // RFC 3339, UTC: last session activity in this folder.
  string last_used_at = 5;
  // False when the folder no longer exists.
  bool exists = 6;
}

message ListDirectoryRequest {
  // Absolute path; empty = the user's home directory. "~" prefixes are expanded.
  string path = 1;
  bool include_hidden = 2;
}

message ListDirectoryResponse {
  // The resolved absolute path that was listed.
  string path = 1;
  // Parent directory; empty at the filesystem root.
  string parent = 2;
  repeated DirectoryEntry entries = 3;
  string home = 4;
}

message DirectoryEntry {
  string name = 1;
  // The entry is a git repository root (has .git).
  bool git_repository = 2;
}

message ListBranchesRequest {
  string cwd = 1;
}

message ListBranchesResponse {
  // Root of the repository containing cwd; empty outside a repository.
  string repository_path = 1;
  string current = 2;
  repeated Branch branches = 3;
}

message Branch {
  string name = 1;
  // Checked out in some worktree (cannot be checked out in a new one).
  bool checked_out = 2;
  // RFC 3339, UTC: last commit time.
  string committed_at = 3;
}

message CreateSessionResponse {
  SessionInfo session = 1;
}

message ListSessionsRequest {
  string cwd = 1;
  bool include_archived = 2;
}

message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
}

// Unset fields are left as they are.
message UpdateSessionRequest {
  string session_id = 1;
  optional bool pinned = 2;
  optional bool unread = 3;
  // true also stops the session if it is live; false brings it back to the list.
  optional bool archived = 4;
  // A rename (recorded as a custom-title transcript entry); it wins over the AI title. Must not be empty.
  optional string title = 5;
  // true clears parent_session_id (recorded in the transcript and synced): a sub-session becomes a top-level
  // session. false is a no-op.
  optional bool detach_from_parent = 6;
}

message UpdateSessionResponse {
  SessionInfo session = 1;
}

message DeleteSessionRequest {
  string session_id = 1;
}

message DeleteSessionResponse {}

message SubscribeRequest {
  string session_id = 1;
  int64 after_seq = 2;
  // Also send control messages (SubscribeResponse.log_id / session, heartbeats); see Subscribe.
  bool control = 3;
}

message SubscribeResponse {
  // Unset on control messages (SubscribeRequest.control: the ones before and after the replay, and heartbeats).
  SessionEvent event = 1;
  // Set on control messages: the id of the event log the seqs belong to. Each opening of a session on the
  // client (a CreateSession, also after the client restarted) starts a new log with seqs from 1. A frontend
  // that resubscribes with after_seq and gets another log_id than before drops what it has and subscribes
  // again with after_seq = 0.
  string log_id = 2;
  // Set on the control message right after the replay: the session as it is now. Its status is the truth
  // when the replayed events disagree (e.g. a turn the frontend saw start whose end it missed).
  SessionInfo session = 3;
}

message SessionEvent {
  int64 seq = 1;
  string session_id = 2;
  // RFC 3339, UTC.
  string timestamp = 3;
  oneof event {
    SessionInfo session_updated = 4;
    UserMessage user_message = 5;
    AssistantDelta assistant_delta = 6;
    AssistantMessage assistant_message = 7;
    ToolCallStarted tool_call_started = 8;
    ToolCallFinished tool_call_finished = 9;
    PermissionRequest permission_request = 10;
    Question question = 11;
    QueueChanged queue_changed = 12;
    TurnFinished turn_finished = 13;
    Notice notice = 14;
    PermissionResolved permission_resolved = 15;
    QuestionResolved question_resolved = 16;
    SessionEnded session_ended = 17;
    TurnStarted turn_started = 18;
    TodosUpdated todos_updated = 19;
    PlanProposed plan_proposed = 20;
    PlanResolved plan_resolved = 21;
    TaskStarted task_started = 22;
    TaskOutput task_output = 23;
    TaskFinished task_finished = 24;
    CheckpointCreated checkpoint_created = 25;
    Rewound rewound = 26;
    Compacted compacted = 27;
    PermissionModeChanged permission_mode_changed = 28;
    ShowRequested show_requested = 29;
    // User shell commands (shell.proto); numbered apart to leave room for other events.
    UserShellStarted user_shell_started = 50;
    UserShellOutput user_shell_output = 51;
    UserShellFinished user_shell_finished = 52;
  }
}

message TurnStarted {
  // UUID of the user message that started the turn.
  string user_message_uuid = 1;
  string model = 2;
}

// Full replacement of the session's todo list (TodoWrite semantics).
message TodosUpdated {
  repeated Todo todos = 1;
}

message Todo {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_PENDING = 1;
    STATUS_IN_PROGRESS = 2;
    STATUS_COMPLETED = 3;
  }
  string content = 1;
  // Present-tense form shown while in progress, e.g. "Running tests".
  string active_form = 2;
  Status status = 3;
}

// Emitted when the model calls ExitPlanMode. The turn waits for RespondToPlan.
message PlanProposed {
  string request_id = 1;
  string tool_use_id = 2;
  // Markdown.
  string plan = 3;
  // Where the plan was written (inside the session's plans directory).
  string plan_file_path = 4;
}

message PlanResolved {
  string request_id = 1;
  RespondToPlanRequest.Decision decision = 2;
  string resolved_by = 3;
  // Feedback sent with DECISION_KEEP_PLANNING (or a note with an approval).
  string feedback = 4;
}

message TaskStarted {
  string task_id = 1;
  // Tool use that started it.
  string tool_use_id = 2;
  string command = 3;
  string description = 4;
  // File the output is streamed to; the model reads it with Read.
  string output_path = 5;
}

// Throttled tail of a background task's output (for the tasks pane); the full output is in output_path.
message TaskOutput {
  string task_id = 1;
  string text = 2;
}

message TaskFinished {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_EXITED = 1;
    REASON_STOPPED = 2;
    REASON_TIME_LIMIT = 3;
    REASON_SESSION_CLOSED = 4;
  }
  string task_id = 1;
  Reason reason = 2;
  int32 exit_code = 3;
  int64 duration_ms = 4;
}

message Checkpoint {
  string id = 1;
  // UUID of the user message that started the turn.
  string user_message_uuid = 2;
  // First line of that prompt, for the rewind menu.
  string prompt_preview = 3;
  // RFC 3339, UTC.
  string created_at = 4;
  // Whether any tracked file changed after this checkpoint (controls "restore code" options).
  bool has_code_changes = 5;
}

message CheckpointCreated {
  Checkpoint checkpoint = 1;
}

message Rewound {
  string checkpoint_id = 1;
  RewindRequest.Mode mode = 2;
  // Files restored and files skipped (symlinks, hardlinks, missing snapshots).
  int32 files_restored = 3;
  int32 files_skipped = 4;
  // Prompt to put back into the input box (Restore conversation / Summarize from here).
  string restored_prompt = 5;
}

message Compacted {
  enum Trigger {
    TRIGGER_UNSPECIFIED = 0;
    TRIGGER_MANUAL = 1;
    TRIGGER_AUTO = 2;
    TRIGGER_REWIND = 3;
    // In the background, after the session was idle (UserPreferences.compact_idle_sessions).
    TRIGGER_IDLE = 4;
  }
  Trigger trigger = 1;
  int64 tokens_before = 2;
  int64 tokens_after = 3;
}

message PermissionModeChanged {
  PermissionMode mode = 1;
}

// Emitted when the model calls Show: a frontend viewing the session opens the matching pane (Files, Diff
// or Browser) and brings the target into view. It only opens; nothing changes. Frontends apply it once,
// when the session is open: a request for a session that is not open waits until the user opens it.
// Transcript replays do not emit it (the Show tool call carries the same target).
message ShowRequested {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // A file: `path`, optionally lines `line_start`..`line_end`.
    KIND_FILE = 1;
    // The session diff: optionally scrolled to the file `path`.
    KIND_DIFF = 2;
    // A web page: `url` (http or https).
    KIND_URL = 3;
  }
  string tool_use_id = 1;
  Kind kind = 2;
  // Absolute path (file, diff).
  string path = 3;
  // 1-based, inclusive; 0 when not given. line_end is 0 or >= line_start.
  int32 line_start = 4;
  int32 line_end = 5;
  string url = 6;
}

message UserMessage {
  // In a UserMessage event: the transcript entry's uuid (a checkpoint id when it started a turn). In
  // QueueChanged: SendUserMessageRequest.uuid.
  string uuid = 1;
  repeated harness.llm.v1.ContentBlock content = 2;
  // UserMessage events only: SendUserMessageRequest.uuid of each message this entry carries, in order (a
  // prompt that started a turn: one; queued messages injected into a running turn together: one each). A
  // UserMessage event means the agent took the message: frontends mark these uuids as read. Recorded in the
  // transcript, so history replay carries them too. Empty for entries a frontend did not send (interrupt
  // markers, older transcripts).
  repeated string client_uuids = 3;
  // QueueChanged only: RFC 3339, UTC, when the client queued the message.
  string queued_at = 4;
}

// Streaming fragment of the assistant message `message_id`.
// Deltas are ephemeral: they are never persisted (neither in the local log nor on the relay) and never
// replayed. A delta does not consume a seq; its SessionEvent.seq is the seq of the last durable event
// emitted before it, so it sorts after that event and before the next durable one. Consumers must not use
// seq to deduplicate deltas. History replay yields only the final AssistantMessage.
message AssistantDelta {
  string message_id = 1;
  int32 index = 2;
  oneof delta {
    string text = 3;
    string thinking = 4;
    string input_json = 5;
  }
}

// The complete assistant message, emitted once its stream ends.
message AssistantMessage {
  string message_id = 1;
  string model = 2;
  repeated harness.llm.v1.ContentBlock content = 3;
  harness.llm.v1.StopReason stop_reason = 4;
  harness.llm.v1.Usage usage = 5;
}

message ToolCallStarted {
  string tool_use_id = 1;
  string name = 2;
  string input_json = 3;
  // Short human-readable summary for collapsed rendering, e.g. "Read src/main.go".
  string summary = 4;
}

message ToolCallFinished {
  string tool_use_id = 1;
  bool is_error = 2;
  bool interrupted = 3;
  repeated harness.llm.v1.ContentBlock content = 4;
  int64 duration_ms = 5;
  // Structured result for rich rendering (Claude Code's toolUseResult shape), e.g.
  // Read: {"file":{"filePath","numLines","totalLines"}}, Bash: {"stdout","stderr","interrupted"},
  // Edit/Write: {"filePath","structuredPatch":[...]}.
  string structured_result_json = 6;
  // Short human-readable summary for collapsed rendering, e.g. "Read 42 lines".
  string summary = 7;
}

message PermissionRequest {
  string request_id = 1;
  string tool_use_id = 2;
  string tool_name = 3;
  string input_json = 4;
  // Rule the user may choose to always allow, e.g. "Bash(npm run test *)".
  repeated string suggested_rules = 5;
  string reason = 6;
  // Only a one-time approval is possible (protected paths, policy): frontends hide "always allow".
  bool one_time_only = 7;
  // Risk categories from the auto-mode decider when this prompt is an ASK fall-back.
  repeated string risk_categories = 8;
}

// A pending PermissionRequest was answered (by any client, or by a hook / rule). Frontends dismiss the card.
message PermissionResolved {
  string request_id = 1;
  RespondToPermissionRequest.Decision decision = 2;
  // Who answered: "local", "relay:<frontend>", "hook", "rule", "interrupt".
  string resolved_by = 3;
}

// A pending Question was answered (or cancelled). Frontends replace the card with its outcome.
message QuestionResolved {
  string request_id = 1;
  // Who resolved it: "local", "interrupt" (Stop or session closed), "history" (replayed from the transcript).
  string resolved_by = 2;
  QuestionOutcome outcome = 3;
  // QUESTION_OUTCOME_ANSWERED: one entry per question, in order.
  repeated QuestionAnswer answers = 4;
  // QUESTION_OUTCOME_MESSAGE: the text of the chat message(s) used as the answer.
  string message = 5;
}

// How a Question ended.
enum QuestionOutcome {
  QUESTION_OUTCOME_UNSPECIFIED = 0;
  // Answered in the card (some questions may be skipped individually).
  QUESTION_OUTCOME_ANSWERED = 1;
  // The user skipped the whole card; the model decides itself.
  QUESTION_OUTCOME_SKIPPED = 2;
  // The user's queued chat message(s) became the free-form answer.
  QUESTION_OUTCOME_MESSAGE = 3;
  // Stop, the session closed, or the client restarted while the question was open.
  QUESTION_OUTCOME_CANCELLED = 4;
}

// The session ended on its host; no more events follow (a resume creates a new subscription).
message SessionEnded {
  // e.g. "exit", "killed", "host_shutdown", "superseded".
  string reason = 1;
}

message Question {
  string request_id = 1;
  string tool_use_id = 2;
  repeated QuestionItem items = 3;
}

message QuestionItem {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    // Exactly one of the options.
    TYPE_SINGLE = 1;
    // Between min and max of the options.
    TYPE_MULTI = 2;
    // Free text only; no options.
    TYPE_TEXT = 3;
    // A single choice between the options "Yes" and "No".
    TYPE_YES_NO = 4;
  }
  string question = 1;
  string header = 2;
  // Same as type == TYPE_MULTI (kept for older frontends).
  bool multi_select = 3;
  // TYPE_YES_NO carries its two options too.
  repeated QuestionOption options = 4;
  Type type = 5;
  // TYPE_MULTI: bounds of the number of choices, "Other" counting as one.
  int32 min = 6;
  int32 max = 7;
  // Questions with options offer "Other…" with free text.
  bool allow_other = 8;
}

message QuestionOption {
  string label = 1;
  string description = 2;
  // Suggested by the model: shown first and highlighted.
  bool recommended = 3;
}

// The client's queue of messages sent while a turn runs, in order (full replacement). A message leaves it when it
// is injected into the running turn or starts the next one (a UserMessage event with its client_uuids follows),
// is taken back (RemoveQueuedMessage) or becomes a question's answer (QUESTION_OUTCOME_MESSAGE).
message QueueChanged {
  repeated UserMessage queued = 1;
}

message TurnFinished {
  enum Result {
    RESULT_UNSPECIFIED = 0;
    RESULT_SUCCESS = 1;
    RESULT_INTERRUPTED = 2;
    RESULT_ERROR_MAX_TURNS = 3;
    RESULT_ERROR_DURING_EXECUTION = 4;
  }
  Result result = 1;
  int32 num_turns = 2;
  harness.llm.v1.Usage usage = 3;
  double cost_usd = 4;
  int64 duration_ms = 5;
  string error_message = 6;
}

message Notice {
  enum Level {
    LEVEL_UNSPECIFIED = 0;
    LEVEL_INFO = 1;
    LEVEL_WARNING = 2;
    LEVEL_ERROR = 3;
  }
  Level level = 1;
  // e.g. "retry", "compacted", "connection_lost".
  string kind = 2;
  string text = 3;
}

message SendUserMessageRequest {
  enum Delivery {
    DELIVERY_UNSPECIFIED = 0; // same as QUEUE
    DELIVERY_QUEUE = 1;
    DELIVERY_NOW = 2;
  }
  string session_id = 1;
  // Client-generated id used for deduplication.
  string uuid = 2;
  repeated harness.llm.v1.ContentBlock content = 3;
  Delivery delivery = 4;
}

message SendUserMessageResponse {}

message RemoveQueuedMessageRequest {
  string session_id = 1;
  // UserMessage.uuid from QueueChanged.
  string uuid = 2;
}

message RemoveQueuedMessageResponse {
  bool removed = 1;
}

message InterruptRequest {
  string session_id = 1;
}

message InterruptResponse {
  // No turn (nor the reply to an interrupted one) was running: nothing was interrupted.
  bool idle = 1;
}

message RespondToPermissionRequest {
  enum Decision {
    DECISION_UNSPECIFIED = 0;
    DECISION_ALLOW = 1;
    // Allow and persist `rule` to .claude/settings.local.json.
    DECISION_ALLOW_ALWAYS = 2;
    // With a comment the model continues; without one the turn stops.
    DECISION_DENY = 3;
  }
  string session_id = 1;
  string request_id = 2;
  Decision decision = 3;
  string rule = 4;
  // Passed to the model with the result (allow) or as the denial reason (deny).
  string comment = 5;
  // Optional user-edited tool input.
  string updated_input_json = 6;
}

message RespondToPermissionResponse {}

message AnswerQuestionRequest {
  string session_id = 1;
  string request_id = 2;
  // QUESTION_OUTCOME_ANSWERED (or unspecified): one entry per question, in order.
  repeated QuestionAnswer answers = 3;
  // ANSWERED (default), SKIPPED (the model decides itself) or MESSAGE (answer with
  // queued chat messages). CANCELLED is not accepted: use Interrupt.
  QuestionOutcome outcome = 4;
  // QUESTION_OUTCOME_MESSAGE: uuids of the queued messages to use, in order; empty means
  // all queued messages. They leave the queue and become the free-form answer.
  repeated string message_uuids = 5;
}

message QuestionAnswer {
  // Labels of the chosen options.
  repeated string selected = 1;
  // Free text: the "Other…" answer, or the answer to a TYPE_TEXT question.
  string text = 2;
  // The user left this question unanswered.
  bool skipped = 3;
}

message AnswerQuestionResponse {}

