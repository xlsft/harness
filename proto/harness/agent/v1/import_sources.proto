syntax = "proto3";

package harness.agent.v1;

import "harness/agent/v1/import.proto";

// AgentService.ListImportSources, ScanImportSource and RunImportSource: Settings > Import for every tool the client
// can import from (docs/design/import.md). The client's import engine (packages/client/importer) decides everything:
// which tools are there, where each item goes, what already exists, what looks like a secret. Frontends render the
// answer and send back the item ids the user chose. Statuses are ClaudeImportStatus, shared with the Claude Code
// import.

message ImportSourceInfo {
  // Stable: "claude-desktop", "cursor", "folder" (Any folder), "claude-code", "claude-project".
  string id = 1;
  string name = 2;
  string description = 3;
  // A key of the UI's logo table; empty shows the name's initials.
  string logo = 4;
  // It reads user-level files on this machine; it reads a project folder (the frontend asks for one).
  bool user_level = 5;
  bool folder_level = 6;
  // The tool's user-level files are on this machine.
  bool detected = 7;
  // A source with a screen of its own ("claude-code", "claude-project"); empty: the generic scan/choose/run screen.
  string screen = 8;
}

message ListImportSourcesRequest {}

message ListImportSourcesResponse {
  repeated ImportSourceInfo sources = 1;
  // This client has a server for user-level documents.
  bool connected = 2;
}

message ImportSourceItem {
  // What RunImportSourceRequest.item_ids takes.
  string id = 1;
  // The group to show it in: "instructions", "mcp", "commands", "agents", "skills", "settings", "sessions".
  string section = 2;
  // "instructions", "rule", "command", "agent", "skill", "mcp", "settings", "session".
  string kind = 3;
  string name = 4;
  // The file it was read from ("~/..." or relative to the folder) and where it goes ("AGENTS.md",
  // ".harness/rules/x.md", "rule cursor/x.md", "MCP server x on this device").
  string source = 5;
  string target = 6;
  ClaudeImportStatus status = 7;
  string note = 8;
  // It holds hooks, allow rules or MCP servers, which apply only once the folder is trusted (and the server approved).
  bool needs_trust = 9;
  // Values that look like secrets were found: include_secrets changes what it brings.
  bool has_secrets = 10;
}

message ScanImportSourceRequest {
  string source_id = 1;
  // A folder source's folder (any folder inside the project; its repository root is used). Empty: user level.
  string folder = 2;
}

message ScanImportSourceResponse {
  string source_id = 1;
  // The folder imported into: the project root of the requested folder. Empty at user level.
  string root = 2;
  // The source had anything at all.
  bool found = 3;
  repeated ImportSourceItem items = 4;
  // There is a server for user-level documents; without one their items fail.
  bool connected = 5;
  // The server answered which documents exist. False: items that may exist read as new.
  bool server_checked = 6;
  // The folder is trusted.
  bool trusted = 7;
}

message RunImportSourceRequest {
  string source_id = 1;
  // As in ScanImportSourceRequest.
  string folder = 2;
  // The ImportSourceItem.id values chosen.
  repeated string item_ids = 3;
  // Store values that look like secrets. Off: they stay out, and the item's note names them.
  bool include_secrets = 4;
  // Replace what is already there.
  bool force = 5;
}

message ImportSourceProgress {
  // What is being done now, or was just finished: "mcp filesystem".
  string current = 1;
  int32 done = 2;
  int32 total = 3;
  // The item that just finished; unset when one is only starting.
  ImportSourceItem item = 4;
}

message ImportSourceReport {
  repeated ImportSourceItem items = 1;
  int32 imported = 2;
  int32 exists = 3;
  int32 skipped = 4;
  int32 errors = 5;
  int32 manual = 6;
  // Why the run as a whole stopped; empty otherwise.
  string error = 7;
}

message RunImportSourceResponse {
  oneof event {
    ImportSourceProgress progress = 1;
    // The last message of a run that was not cancelled.
    ImportSourceReport report = 2;
  }
}
