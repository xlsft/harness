syntax = "proto3";

package harness.prompts.v1;

// Prompts live on the server (prompt registry). Clients have no prompt texts of their own,
// apart from a minimal emergency fallback for a first run without network access.
service PromptService {
  // Returns the bundle for a model with model-specific overrides already applied.
  rpc GetBundle(GetBundleRequest) returns (GetBundleResponse);
}

message GetBundleRequest {
  string model = 1;
  // Version the client already has; the server answers not_modified if it is current.
  string if_none_match = 2;
}

message GetBundleResponse {
  bool not_modified = 1;
  // Empty when not_modified = true.
  PromptBundle bundle = 2;
}

// Rules for clients:
// - Sections before the dynamic boundary are static: send them as system blocks, cache = true on the last one.
//   Sections after it are dynamic; fill their {{placeholders}} (unknown placeholders become empty + a warning).
//   Supported placeholders: cwd, platform, shell, os_version, date, is_git, git_status, model_id,
//   model_display_name, additional_directories, scratchpad_dir.
// - Only tools defined here are exposed to the model. Their execution semantics are implemented by the client
//   and must match the description text (see docs/PLAN.md, section 2.2).
// - A bundle is frozen for the whole session (until it ends or is compacted); switching breaks the prompt cache.
// - Clients cache bundles at ~/.harness/cache/prompts/<model>/<version>.json.
// - Prompt texts are written from scratch (clean-room); never copied from Claude Code.
message PromptBundle {
  string version = 1;
  string model = 2;
  repeated SystemSection system = 3;
  // Keyed by tool name (Read, Write, Edit, Bash, Glob, Grep, ...).
  map<string, ToolDefinition> tools = 4;
  // Keyed by reminder id. Known ids (clients skip a reminder whose id is missing):
  //   project_instructions  {{content}}            CLAUDE.md / AGENTS.md / user memory, first user message
  //   file_changed          {{path}} {{diff}}      a file the model read changed on disk
  //   empty_file            {{path}}               Read of an empty file
  //   interrupted                                  user message after an interruption
  //   interrupted_tool_use                         tool_result of a call cancelled by an interruption
  //   todo_nudge                                   several turns without TodoWrite on a multi-step task
  //   plan_mode             {{plan_file_path}}     plan mode is active: read-only, write the plan, call ExitPlanMode
  //   plan_approved         {{plan_file_path}}     the user approved the plan
  //   plan_rejected         {{feedback}}           the user asked to keep planning
  //   background_task_done  {{task_id}} {{command}} {{status}} {{tail}} {{output_path}}
  //   agent_report          {{agent_id}} {{name}} {{agent_type}} {{status}} {{report}} {{details}}
  //   agent_message         {{from}} {{message}}
  //   agent_context         {{agent_id}} {{agent_type}} {{instructions}}
  //   agent_type_general, agent_type_explore, agent_type_plan
  //   monitor_match         {{task_id}} {{description}} {{pattern}} {{count}} {{lines}} {{status}}  a Monitor found matching lines
  //   monitor_stopped       {{task_id}} {{description}} {{pattern}} {{reason}}  a Monitor ended by itself (timeout, too noisy)
  //   compacted                                    first message after a compaction summary
  //   attribution           {{commit}} {{pr}}      commit / PR attribution lines
  //   output_style          {{name}} {{content}}   the active output style (sent at session start and on change)
  //   environment_changed   {{directories}} {{variables}}  the user edited the running session's environment
  //   session_moved         {{cwd}} {{previous}} {{branch}} {{directories}} {{details}}  the session moved itself
  //                         to another folder or worktree while running
  //   user_shell_command    {{cwd}} {{command}} {{exit_code}} {{output}} {{status}}  the user ran a command in
  //                         the composer's shell mode (RunShellCommand); rides on the next model request
  //   usage_limit_wrap_up   {{provider}} {{detail}} {{resets}}  the session's provider is nearly out of usage
  //                         (harness.agent.v1.UsageLimit WRAP_UP): once per turn, while the turn goes on
  //   session_message       {{from_id}} {{from_name}} {{from_title}} {{message}}  another session sent this session a
  //                         message (SessionSend); it carries no user authority
  //   session_report        {{session_id}} {{name}} {{title}} {{status}} {{report}}  a session started from this one
  //                         ended a turn; {{report}} is the start of its latest answer
  //   side_chat            (none)                 not a reminder: the system prompt of side chats (AskSideChat)
  //   bash_background_user / bash_background_queued_message / bash_background_agent  {{task_id}} {{output_path}}
  //   bash_background_timeout  {{timeout}} {{task_id}} {{output_path}}
  //                         not reminders: the Bash tool_result when the command runs as a background task
  //                         (moved by the user / for a queued message / run_in_background / hit its timeout)
  map<string, string> reminders = 5;
  string compaction_instruction = 6;
  string title_instruction = 7;
  // Built-in output styles keyed by id (default, proactive, concise, explanatory, learning). User and
  // project styles come from sync (DOCUMENT_KIND_OUTPUT_STYLE) and .claude/output-styles/*.md with the
  // same fields in their frontmatter. "default" adds nothing.
  map<string, OutputStyle> output_styles = 8;
  reserved 9; // tool_title_instruction: the model labels its Bash calls itself (description)
}

// An output style changes how the assistant communicates (tone, verbosity, teaching) without changing
// the tools. The client delivers the active style's text through the `output_style` reminder, so
// switching styles never invalidates the prompt cache.
message OutputStyle {
  string id = 1;
  // Shown in pickers, e.g. "Explanatory".
  string name = 2;
  // One line for the picker.
  string description = 3;
  // The style instructions (markdown).
  string text = 4;
  // When false, the coding-specific system sections (doing_tasks, tool_policy) are replaced by the
  // style: the client sends the system sections without them. Default true for built-ins.
  bool keep_coding_instructions = 5;
}

message SystemSection {
  // identity, safety, style, doing_tasks, tool_policy, env, ...
  string id = 1;
  string text = 2;
  // Marks the boundary between static and dynamic sections; text is empty.
  bool dynamic_boundary = 3;
}

message ToolDefinition {
  string description = 1;
  // JSON Schema (draft-07) of the tool input.
  string input_schema_json = 2;
}
