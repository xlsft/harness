syntax = "proto3";

package harness.chat.v1;

// ChatService connects the server to chat apps (Slack and Telegram; the provider enum leaves room for Microsoft Teams).
// People mention the bot or write to it, and a session starts on one of their own machines (or an always-on host)
// through the relay; the thread or chat gets progress, permission prompts as buttons and the final answer, and replies
// steer the session. docs/design/chat.md is the spec.
//
// Inbound traffic from the chat app is plain HTTP: POST /api/chat/slack/events (Event Subscriptions and Interactivity
// may both point there; signature-checked) and POST /api/chat/telegram/webhook/{org|<bot id>} (Telegram's secret token
// header checked). A Telegram bot may instead be long-polled by the server when it has no public HTTPS URL.
//
// Requires `Authorization: Bearer <access token>`. The app RPCs are admin-only; the identity and personal bot RPCs act
// on the caller's own links and bot only (no one else, admins included, can list them).
service ChatService {
  // --- Admin: the app ---
  rpc GetChatApp(GetChatAppRequest) returns (GetChatAppResponse);
  // Saves the app. Secrets are write-only: an empty field keeps the stored one. The bot token is checked with the
  // provider (Slack auth.test) before anything is stored.
  rpc PutChatApp(PutChatAppRequest) returns (PutChatAppResponse);
  rpc DeleteChatApp(DeleteChatAppRequest) returns (DeleteChatAppResponse);

  // --- The caller's identities ---
  rpc ListMyChatIdentities(ListMyChatIdentitiesRequest) returns (ListMyChatIdentitiesResponse);
  // A one-time code (single use, 15 minutes) the caller sends to the bot as "link <code>" to link that chat identity.
  rpc StartChatLink(StartChatLinkRequest) returns (StartChatLinkResponse);
  rpc UnlinkChatIdentity(UnlinkChatIdentityRequest) returns (UnlinkChatIdentityResponse);

  // --- The caller's own bot (Telegram) ---
  // A bot of the caller's own, used instead of or next to the organization's. Only its owner can use it, see it or
  // change it. The managed policy can turn personal bots off (disablePersonalChatBots).
  rpc GetMyChatBot(GetMyChatBotRequest) returns (GetMyChatBotResponse);
  // The token is write-only and checked with the provider (Telegram getMe) before anything is stored.
  rpc PutMyChatBot(PutMyChatBotRequest) returns (PutMyChatBotResponse);
  rpc DeleteMyChatBot(DeleteMyChatBotRequest) returns (DeleteMyChatBotResponse);
}

enum ChatProvider {
  CHAT_PROVIDER_UNSPECIFIED = 0;
  CHAT_PROVIDER_SLACK = 1;
  // Reserved for a later Teams provider; not implemented.
  CHAT_PROVIDER_TEAMS = 2;
  CHAT_PROVIDER_TELEGRAM = 3;
}

// How a Telegram bot's updates reach the server.
enum ChatDelivery {
  // A webhook when the server's public URL is HTTPS, long polling otherwise.
  CHAT_DELIVERY_UNSPECIFIED = 0;
  // setWebhook with a secret token the server checks on every request.
  CHAT_DELIVERY_WEBHOOK = 1;
  // getUpdates from the server (no public URL needed; one server replica).
  CHAT_DELIVERY_POLLING = 2;
}

message ChatApp {
  ChatProvider provider = 1;
  // Credentials are stored.
  bool configured = 2;
  // Turned on by the admin (the managed policy can still turn every chat app off).
  bool enabled = 3;
  // The workspace of the token (Slack team id and name) and the bot's own user id.
  string team_id = 4;
  string team_name = 5;
  string bot_user_id = 6;
  // Where the chat app sends events and button presses.
  string request_url = 7;
  // Link an unlinked chat user to the account with the same email when that account comes from the directory or has
  // a verified email.
  bool match_by_email = 8;
  // RFC 3339, UTC; empty: none yet.
  string last_event_at = 9;
  string last_error = 10;
  // The organization's managed policy turns chat apps off.
  bool disabled_by_policy = 11;
  // Telegram: what the admin chose, and what is in use (never UNSPECIFIED once configured).
  ChatDelivery delivery = 12;
  ChatDelivery active_delivery = 13;
}

message GetChatAppRequest {
  ChatProvider provider = 1;
}

message GetChatAppResponse {
  ChatApp app = 1;
}

message PutChatAppRequest {
  ChatProvider provider = 1;
  // Slack: xoxb-... Empty keeps the stored token.
  string bot_token = 2;
  // Slack: the app's signing secret. Empty keeps the stored one.
  string signing_secret = 3;
  bool enabled = 4;
  bool match_by_email = 5;
  // Telegram only.
  ChatDelivery delivery = 6;
}

message PutChatAppResponse {
  ChatApp app = 1;
}

message DeleteChatAppRequest {
  ChatProvider provider = 1;
}

message DeleteChatAppResponse {}

message ChatIdentity {
  ChatProvider provider = 1;
  string team_id = 2;
  string external_user_id = 3;
  // The chat user's name as the provider showed it when linking.
  string display_name = 4;
  // "directory" or "code".
  string linked_via = 5;
  // RFC 3339, UTC.
  string linked_at = 6;
}

message ListMyChatIdentitiesRequest {}

message ListMyChatIdentitiesResponse {
  repeated ChatIdentity identities = 1;
  // Whether an app is connected and on (and not off by policy): the settings screen says so instead of offering links.
  bool available = 2;
  // Each provider the caller can use: the organization's app, or for Telegram also the caller's own bot.
  repeated ChatProvider available_providers = 3;
  // Telegram: the organization bot's username (without @), for a t.me link. Empty when there is none.
  string telegram_bot_username = 4;
}

message StartChatLinkRequest {
  ChatProvider provider = 1;
  // Telegram: the deep link opens the caller's own bot instead of the organization's.
  bool personal_bot = 2;
}

message StartChatLinkResponse {
  // Shown once; only a hash is stored.
  string code = 1;
  // RFC 3339, UTC.
  string expires_at = 2;
  // Telegram: https://t.me/<bot>?start=<code>, which sends the code to the bot when opened. Empty for Slack.
  string deep_link = 3;
}

message UnlinkChatIdentityRequest {
  ChatProvider provider = 1;
  string team_id = 2;
  string external_user_id = 3;
}

message UnlinkChatIdentityResponse {}

// A bot the caller brought (Telegram). Never carries the token.
message ChatBot {
  ChatProvider provider = 1;
  string id = 2;
  bool enabled = 3;
  // The bot's Telegram user id and username (without @).
  string bot_user_id = 4;
  string bot_username = 5;
  ChatDelivery delivery = 6;
  ChatDelivery active_delivery = 7;
  // Where Telegram sends updates when the delivery is a webhook.
  string request_url = 8;
  // RFC 3339, UTC; empty: none yet.
  string last_event_at = 9;
  string last_error = 10;
}

message GetMyChatBotRequest {
  ChatProvider provider = 1;
}

message GetMyChatBotResponse {
  // Unset when the caller has none.
  ChatBot bot = 1;
  // False when the managed policy turns personal bots or chat apps off.
  bool allowed = 2;
}

message PutMyChatBotRequest {
  ChatProvider provider = 1;
  // From @BotFather. Empty keeps the stored token.
  string bot_token = 2;
  bool enabled = 3;
  ChatDelivery delivery = 4;
}

message PutMyChatBotResponse {
  ChatBot bot = 1;
}

message DeleteMyChatBotRequest {
  ChatProvider provider = 1;
}

message DeleteMyChatBotResponse {}
