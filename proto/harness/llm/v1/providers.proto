syntax = "proto3";

package harness.llm.v1;

// ProviderService manages the LLM providers (upstream API + key) whose models GatewayService offers, for the
// settings screens of the apps. Two scopes:
//   - GLOBAL providers are managed by admins and offered to every user (each model's roles still apply);
//   - PERSONAL providers are added by any signed-in user with their own API key. Only the owner sees them
//     and their models, and only the owner's requests can use them. Their ids are generated by the server.
// Model ids: global models keep the alias the admin chose; personal models are always
// "<provider id>/<upstream model>", so they never clash with global aliases or with other users' models.
// API keys are write-only: they are stored encrypted and never returned (api_key_set / api_key_hint instead).
// Personal keys are encrypted at rest with a per-user data key; admins see only api_key_set for them.
// Anything outside the caller's scope answers NOT_FOUND, never PERMISSION_DENIED, so it does not leak.
//
// Frontends reach it through the local client, which forwards these calls to the server with the user's
// credentials (packages/client/server/coreproxy.go); a page served by the server can call it directly.
// Requires `Authorization: Bearer <access token>`. Status: DRAFT (M2).
service ProviderService {
  // The caller's providers: the global ones first (all of them for admins, enabled ones for everyone
  // else), then the caller's personal ones; each with the models the caller may see.
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  // GLOBAL needs the admin role.
  rpc CreateProvider(CreateProviderRequest) returns (CreateProviderResponse);
  // Admins may update global providers; everyone may update their own.
  rpc UpdateProvider(UpdateProviderRequest) returns (UpdateProviderResponse);
  // A global provider that models still use is refused (INVALID_ARGUMENT); a personal one takes its
  // models with it.
  rpc DeleteProvider(DeleteProviderRequest) returns (DeleteProviderResponse);
  // Asks the upstream which models it offers (its /v1/models list), to pick models from. Doubles as a
  // connection test for the base URL and key.
  rpc DiscoverModels(DiscoverModelsRequest) returns (DiscoverModelsResponse);
  rpc AddModel(AddModelRequest) returns (AddModelResponse);
  rpc RemoveModel(RemoveModelRequest) returns (RemoveModelResponse);

  // The auto-mode classifier's typed decision model (the decision_model step of DecisionService's chain),
  // using the key of a global provider. Admin only.
  rpc GetClassifier(GetClassifierRequest) returns (GetClassifierResponse);
  rpc SetClassifier(SetClassifierRequest) returns (SetClassifierResponse);
}

enum ProviderScope {
  PROVIDER_SCOPE_UNSPECIFIED = 0;
  PROVIDER_SCOPE_GLOBAL = 1;
  PROVIDER_SCOPE_PERSONAL = 2;
}

message Provider {
  string id = 1;
  ProviderScope scope = 2;
  // "anthropic", "openai-chat" or "openai-responses".
  string type = 3;
  string display_name = 4;
  string base_url = 5;
  bool api_key_set = 6;
  // The key's last characters ("…abcd"), to tell keys apart.
  string api_key_hint = 7;
  // Names of the extra request headers (values are write-only, like the key).
  repeated string header_names = 8;
  bool enabled = 9;
  // Global providers only (admins): requests may reach private networks (a local vLLM / Ollama).
  bool allow_private_network = 10;
  // Whether the caller may change it (admins: global providers; everyone: their own).
  bool editable = 11;
  repeated ProviderModel models = 12;
  // RFC 3339, UTC.
  string created_at = 13;
  string updated_at = 14;
}

message ProviderModel {
  // The id clients send as `model` (see the service comment for the rules).
  string id = 1;
  string display_name = 2;
  string upstream_model = 3;
  int64 context_window = 4;
  int64 max_output_tokens = 5;
  bool enabled = 6;
}

message ListProvidersRequest {}

message ListProvidersResponse {
  repeated Provider providers = 1;
  // Provider types the server supports.
  repeated string types = 2;
  // The caller is an admin: may create and change global providers and the classifier.
  bool can_manage_global = 3;
}

message CreateProviderRequest {
  ProviderScope scope = 1;
  // GLOBAL only: the provider id ([a-z0-9][a-z0-9._-]*); personal providers get a generated one.
  string id = 2;
  string type = 3;
  string display_name = 4;
  string base_url = 5;
  // Optional (a local server may need none).
  string api_key = 6;
  map<string, string> headers = 7;
  // GLOBAL only.
  bool allow_private_network = 8;
}

message CreateProviderResponse {
  Provider provider = 1;
}

// Unset fields keep their value.
message UpdateProviderRequest {
  string id = 1;
  optional string type = 2;
  optional string display_name = 3;
  optional string base_url = 4;
  // An empty string removes the key.
  optional string api_key = 5;
  // Replaces all extra headers when set.
  optional Headers headers = 6;
  optional bool enabled = 7;
  // GLOBAL only.
  optional bool allow_private_network = 8;
}

message Headers {
  map<string, string> values = 1;
}

message UpdateProviderResponse {
  Provider provider = 1;
}

message DeleteProviderRequest {
  string id = 1;
}

message DeleteProviderResponse {}

message DiscoverModelsRequest {
  string provider_id = 1;
}

message DiscoverModelsResponse {
  repeated ModelCandidate models = 1;
}

message ModelCandidate {
  string upstream_model = 1;
  string display_name = 2;
  // 0 when the upstream does not say.
  int64 context_window = 3;
  int64 max_output_tokens = 4;
  // Ids of this provider's models that already use this upstream model.
  repeated string model_ids = 5;
}

message AddModelRequest {
  string provider_id = 1;
  string upstream_model = 2;
  // GLOBAL providers only: the catalog alias (default: the upstream model id).
  string id = 3;
  string display_name = 4;
  // 0: server defaults.
  int64 context_window = 5;
  int64 max_output_tokens = 6;
  bool thinking = 7;
  bool images = 8;
}

message AddModelResponse {
  ProviderModel model = 1;
}

message RemoveModelRequest {
  string model_id = 1;
}

message RemoveModelResponse {}

message GetClassifierRequest {}

message GetClassifierResponse {
  Classifier classifier = 1;
}

message SetClassifierRequest {
  Classifier classifier = 1;
}

message SetClassifierResponse {
  Classifier classifier = 1;
}

// Auto mode decides with the chain rules -> decision model (this) -> model classifier (llm).
message Classifier {
  // The decision model step is in the chain.
  bool enabled = 1;
  // Global provider whose API key the decision model uses; its host must be the endpoint's host.
  string provider_id = 2;
  // "openrouter", "typesafe" or an https URL of a server speaking the same protocol. Empty: derived from
  // the provider's base URL (openrouter.ai -> "openrouter", api.typesafe.ai -> "typesafe").
  string endpoint = 3;
  // Decision model id (default "typesafe/jev-1.13" on OpenRouter).
  string model = 4;
  // A label is taken when its probability >= min_probability and its lead over the runner-up >= min_margin.
  double min_probability = 5;
  double min_margin = 6;
  // When unsure: "next" (ask the model classifier) or "ask" (ask the developer).
  string on_uncertain = 7;
  int32 timeout_ms = 8;
  // Catalog model (global) of the model classifier step; empty: the classifier / small slot.
  string llm_model = 9;
}
