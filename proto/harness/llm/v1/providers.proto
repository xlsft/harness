syntax = "proto3";

package harness.llm.v1;

import "harness/llm/v1/content.proto";
import "harness/llm/v1/gateway.proto";

// ProviderService manages the LLM providers (upstream API + key) whose models GatewayService offers, for the
// settings screens of the apps. Two scopes:
//   - GLOBAL providers are managed by admins and offered to every user (each model's roles still apply);
//   - PERSONAL providers are added by any signed-in user with their own API key. Only the owner sees them
//     and their models, and only the owner's requests can use them. Their ids are generated by the server.
// Model ids: global models keep the alias the admin chose; personal models are always
// "<provider id>/<upstream model>", so they never clash with global aliases or with other users' models.
// API keys are write-only: they are stored encrypted and never returned (api_key_set / api_key_hint instead).
// Personal keys are encrypted at rest with a per-user data key; admins see only api_key_set for them.
// Anything outside the caller's scope answers NOT_FOUND, never PERMISSION_DENIED, so it does not leak.
//
// Frontends reach it through the local client, which forwards these calls to the server with the user's
// credentials (packages/client/server/coreproxy.go); a page served by the server can call it directly.
// Requires `Authorization: Bearer <access token>`. Status: DRAFT (M2).
service ProviderService {
  // The well-known services the settings screens offer to connect in one step (presets), and the protocols a
  // custom provider may speak. Served by the server, so a new preset needs no app release.
  rpc ListPresets(ListPresetsRequest) returns (ListPresetsResponse);
  // The caller's providers: the global ones first (all of them for admins, enabled ones for everyone
  // else), then the caller's personal ones; each with the models the caller may see.
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  // GLOBAL needs the admin role.
  rpc CreateProvider(CreateProviderRequest) returns (CreateProviderResponse);
  // Admins may update global providers; everyone may update their own.
  rpc UpdateProvider(UpdateProviderRequest) returns (UpdateProviderResponse);
  // A global provider that models still use is refused (INVALID_ARGUMENT); a personal one takes its
  // models with it.
  rpc DeleteProvider(DeleteProviderRequest) returns (DeleteProviderResponse);
  // Asks the upstream which models it offers (its /v1/models list), to pick models from. Doubles as a
  // connection test for the base URL and key.
  rpc DiscoverModels(DiscoverModelsRequest) returns (DiscoverModelsResponse);
  rpc AddModel(AddModelRequest) returns (AddModelResponse);
  // One-click connection check: an LLM provider lists its models (a 401 / 403 means the key is rejected; a
  // service without a model list counts as reachable); a classifier provider answers one sample decision.
  // Same access as DiscoverModels.
  rpc TestProvider(TestProviderRequest) returns (TestProviderResponse);
  rpc RemoveModel(RemoveModelRequest) returns (RemoveModelResponse);
  // Sets by hand the effort levels of a model of a provider the caller may change, for lists that do not report them,
  // and the level recommended among them.
  // What is set here, also none, is kept: discovery only fills in what nobody set.
  rpc SetModelEfforts(SetModelEffortsRequest) returns (SetModelEffortsResponse);
  // Sets by hand the price of a model of a provider the caller may change, also to none. Kept: lists and presets only
  // fill in an empty price nobody set. Refused on a plan provider, whose requests carry no cost.
  rpc SetModelPricing(SetModelPricingRequest) returns (SetModelPricingResponse);

  // The auto-mode classifier: the decision step of DecisionService's chain (a global classifier provider: a
  // typed decision model or an HTTP policy webhook) and the model of the LLM classifier step. This is the
  // server default for everyone. Admin only.
  rpc GetClassifier(GetClassifierRequest) returns (GetClassifierResponse);
  rpc SetClassifier(SetClassifierRequest) returns (SetClassifierResponse);
  // The caller's own classifier choice over the server default: another global classifier provider or none,
  // and another global model for the model classifier. Applies to the caller's decisions only. Any signed-in
  // user; the response also carries the server default, read-only.
  rpc GetMyClassifier(GetMyClassifierRequest) returns (GetMyClassifierResponse);
  rpc SetMyClassifier(SetMyClassifierRequest) returns (SetMyClassifierResponse);

  // The server-wide default models per role (Slots: main, small, plan, title), as configured. Everyone may
  // read them; SetSlots needs the admin role.
  rpc GetSlots(GetSlotsRequest) returns (GetSlotsResponse);
  rpc SetSlots(SetSlotsRequest) returns (SetSlotsResponse);

  // Web search (harness.search.v1.SearchService, the WebSearch tool): which search provider serves a user's
  // queries. The server default is a global search provider or the built-in SearXNG ("searxng"); each user
  // may pick another one they can use (a global one or their own) for themselves, or follow the default.
  // Any signed-in user may read it and set their own choice; SetSearchDefault needs the admin role.
  rpc GetSearch(GetSearchRequest) returns (GetSearchResponse);
  rpc SetSearchDefault(SetSearchDefaultRequest) returns (SetSearchDefaultResponse);
  rpc SetMySearch(SetMySearchRequest) returns (SetMySearchResponse);
}

enum ProviderScope {
  PROVIDER_SCOPE_UNSPECIFIED = 0;
  PROVIDER_SCOPE_GLOBAL = 1;
  PROVIDER_SCOPE_PERSONAL = 2;
}

// Groups ("sources") of providers:
//   "llm"        - LLM APIs whose models GatewayService offers (types "anthropic", "openai-chat",
//                  "openai-responses");
//   "classifier" - auto-mode decision services (types "decision-model": a typed decision model such as
//                  TypeSafe's Jev; "decision-http": a policy webhook answering {decision, reason}). Classifier
//                  providers are global only, since the decision chain is server-wide;
//   "search"     - web search APIs behind SearchService (types "searxng", "brave", "tavily", "exa", "kagi",
//                  "perplexity"). Global or personal, like LLM providers. The built-in SearXNG is not a
//                  stored provider: its preset has `builtin` set and its provider id is "searxng".
message Provider {
  string id = 1;
  ProviderScope scope = 2;
  // The protocol, see the groups above.
  string type = 3;
  string display_name = 4;
  string base_url = 5;
  bool api_key_set = 6;
  // The key's last characters ("…abcd"), to tell keys apart.
  string api_key_hint = 7;
  // Names of the extra request headers (values are write-only, like the key).
  repeated string header_names = 8;
  bool enabled = 9;
  // Global providers only (admins): requests may reach private networks (a local vLLM / Ollama).
  bool allow_private_network = 10;
  // Whether the caller may change it (admins: global providers; everyone: their own).
  bool editable = 11;
  repeated ProviderModel models = 12;
  // RFC 3339, UTC.
  string created_at = 13;
  string updated_at = 14;
  // The preset it was connected from; empty for a custom provider. Providers created before presets existed
  // report the preset whose type and base URL they match.
  string preset_id = 15;
  // "llm", "classifier" or "search".
  string group = 16;
  // Search providers: their options (see ProviderPreset.options), by name; values are plain text.
  map<string, string> options = 17;
  // LLM providers: "metered" (pay as you go) or "plan" (a subscription / coding plan), from its preset; a
  // custom provider is "metered" (its models cost what their catalog price says, nothing without one).
  string billing = 18;
}

message ProviderModel {
  // The id clients send as `model` (see the service comment for the rules).
  string id = 1;
  string display_name = 2;
  string upstream_model = 3;
  int64 context_window = 4;
  int64 max_output_tokens = 5;
  bool enabled = 6;
  // Effort levels the model takes, lowest first; empty when it has none.
  repeated Effort efforts = 7;
  // The level recommended for a new session, one of `efforts`; UNSPECIFIED: none.
  Effort default_effort = 8;
  // What a request costs on a metered provider. Absent: no price known, so its requests carry no cost. A zero cache
  // price means "same as input".
  optional Pricing pricing = 9;
  // Someone set `pricing` by hand (also to none): model lists and presets leave it alone.
  bool pricing_set_by_hand = 10;
}

message ListPresetsRequest {}

message ListPresetsResponse {
  // In display order, LLM presets first.
  repeated ProviderPreset presets = 1;
  // Protocols a custom provider may use.
  repeated ProviderProtocol protocols = 2;
}

// A well-known service: the user enters only its `fields` (usually just the API key).
message ProviderPreset {
  // Stable id ([a-z0-9-]+), sent as CreateProviderRequest.preset_id.
  string id = 1;
  // "llm" or "classifier".
  string group = 2;
  string display_name = 3;
  // One line for the settings screen.
  string description = 4;
  // The protocol (Provider.type).
  string type = 5;
  // The default base URL (a classifier's: the full endpoint URL).
  string base_url = 6;
  // What the user fills in, in order.
  repeated PresetField fields = 7;
  // Where the service documents its API, and where its keys are created (either may be empty).
  string docs_url = 8;
  string key_url = 9;
  // Models offered when the service has no model list (or a classifier's decision models); with
  // discovers_models they are only a fallback for the picker.
  repeated PresetModel default_models = 10;
  // A short monogram ("OR", "AN") the apps draw as the preset's icon.
  string icon = 11;
  // The service lists its models (DiscoverModels asks it); otherwise DiscoverModels answers default_models.
  bool discovers_models = 12;
  // Usually runs on the local network (Ollama): connecting it globally allows private networks; personal
  // providers cannot reach private addresses.
  bool local = 13;
  // Search presets: per-provider settings the user may change after connecting (result count, safe search,
  // country, language), only those the service supports.
  repeated PresetOption options = 14;
  // Ships with the server (the bundled SearXNG): nothing to connect, its provider id is the preset id.
  bool builtin = 15;
  // LLM presets: "metered" (pay as you go: requests to priced models count their cost) or "plan" (a flat-rate
  // subscription / coding plan: usage counts tokens only, never cost; see harness.llm.v1.UsageService).
  string billing = 16;
}

// A setting of a connected provider.
message PresetOption {
  // "max_results", "safe_search", "country" or "language".
  string name = 1;
  string label = 2;
  // "number", "select" or "text".
  string kind = 3;
  // "select": the allowed values, in order.
  repeated OptionChoice choices = 4;
  // What applies while it is unset.
  string default_value = 5;
  string placeholder = 6;
  // "number": the allowed range.
  int32 min = 7;
  int32 max = 8;
}

message OptionChoice {
  string value = 1;
  string label = 2;
}

message PresetField {
  // "api_key" or "base_url".
  string name = 1;
  string label = 2;
  bool required = 3;
  string placeholder = 4;
}

message PresetModel {
  string upstream_model = 1;
  string display_name = 2;
  // 0 when unknown.
  int64 context_window = 3;
  int64 max_output_tokens = 4;
}

message ProviderProtocol {
  // Provider.type.
  string id = 1;
  // "llm" or "classifier".
  string group = 2;
  string label = 3;
  // Placeholder for the base URL field.
  string base_url_hint = 4;
}

message ListProvidersRequest {}

message ListProvidersResponse {
  repeated Provider providers = 1;
  // Provider types the server supports.
  repeated string types = 2;
  // The caller is an admin: may create and change global providers and the classifier.
  bool can_manage_global = 3;
}

message CreateProviderRequest {
  ProviderScope scope = 1;
  // GLOBAL only: the provider id ([a-z0-9][a-z0-9._-]*); empty derives one from the preset or the name.
  // Personal providers always get a generated one.
  string id = 2;
  // Ignored with preset_id (the preset's type).
  string type = 3;
  string display_name = 4;
  string base_url = 5;
  // Optional (a local server may need none).
  string api_key = 6;
  map<string, string> headers = 7;
  // GLOBAL only.
  bool allow_private_network = 8;
  // Connect a preset: type, group, name and base URL default to the preset's (base_url may be overridden
  // only when the preset asks for it), and only the preset's required fields must be set.
  string preset_id = 9;
  // Custom providers: "llm" (default), "classifier" (GLOBAL only) or "search".
  string group = 10;
  // Search providers: initial options.
  map<string, string> options = 11;
}

message CreateProviderResponse {
  Provider provider = 1;
}

// Unset fields keep their value.
message UpdateProviderRequest {
  string id = 1;
  optional string type = 2;
  optional string display_name = 3;
  optional string base_url = 4;
  // An empty string removes the key.
  optional string api_key = 5;
  // Replaces all extra headers when set.
  optional Headers headers = 6;
  optional bool enabled = 7;
  // GLOBAL only.
  optional bool allow_private_network = 8;
  // Search providers: replaces all options when set (an empty value is dropped: the default applies).
  optional ProviderOptions options = 9;
}

message ProviderOptions {
  map<string, string> values = 1;
}

message Headers {
  map<string, string> values = 1;
}

message UpdateProviderResponse {
  Provider provider = 1;
}

message DeleteProviderRequest {
  string id = 1;
}

message DeleteProviderResponse {}

message DiscoverModelsRequest {
  string provider_id = 1;
}

message DiscoverModelsResponse {
  repeated ModelCandidate models = 1;
}

message ModelCandidate {
  string upstream_model = 1;
  string display_name = 2;
  // 0 when the upstream does not say.
  int64 context_window = 3;
  int64 max_output_tokens = 4;
  // Ids of this provider's models that already use this upstream model.
  repeated string model_ids = 5;
}

message AddModelRequest {
  string provider_id = 1;
  string upstream_model = 2;
  // GLOBAL providers only: the catalog alias (default: the upstream model id).
  string id = 3;
  string display_name = 4;
  // 0: server defaults.
  int64 context_window = 5;
  int64 max_output_tokens = 6;
  // On top of what the provider's model list says about the model (false leaves the list's say).
  bool thinking = 7;
  bool images = 8;
}

message AddModelResponse {
  ProviderModel model = 1;
}

message SetModelEffortsRequest {
  string model_id = 1;
  // The whole set; empty: the model takes no effort.
  repeated Effort efforts = 2;
  // The level to recommend, by hand and kept from then on: one of `efforts`, or UNSPECIFIED for none. Absent: unchanged,
  // unless `efforts` drops that level.
  optional Effort default_effort = 3;
}

message SetModelEffortsResponse {
  ProviderModel model = 1;
}

message SetModelPricingRequest {
  string model_id = 1;
  // USD per 1M tokens, by hand and kept from then on. Absent: no price, also kept.
  optional Pricing pricing = 2;
}

message SetModelPricingResponse {
  ProviderModel model = 1;
}

message TestProviderRequest {
  string provider_id = 1;
}

message TestProviderResponse {
  bool ok = 1;
  // What happened, for the user ("Connected, 312 models", "The key was rejected (HTTP 401)"). A search
  // provider runs one sample query ("Connected, 5 results").
  string message = 2;
  // LLM providers: models the service lists (0 when it has no list).
  int32 model_count = 3;
}

message RemoveModelRequest {
  string model_id = 1;
}

message RemoveModelResponse {}

message GetClassifierRequest {}

message GetClassifierResponse {
  Classifier classifier = 1;
}

message SetClassifierRequest {
  Classifier classifier = 1;
}

message SetClassifierResponse {
  Classifier classifier = 1;
}

// Auto mode decides with the chain rules -> decision step (this) -> model classifier (llm).
message Classifier {
  // The decision step is in the chain.
  bool enabled = 1;
  // The global provider the decision step uses: a classifier provider ("decision-model": its base URL is the
  // endpoint; "decision-http": a policy webhook, the thresholds below do not apply), or an LLM provider on
  // the host of a named decision endpoint (its key is reused).
  string provider_id = 2;
  // "openrouter", "typesafe" or an https URL of a server speaking the same protocol. Empty: derived from
  // the provider's base URL (openrouter.ai -> "openrouter", api.typesafe.ai -> "typesafe").
  string endpoint = 3;
  // Decision model id (default "typesafe/jev-1.13" on OpenRouter).
  string model = 4;
  // A label is taken when its probability >= min_probability and its lead over the runner-up >= min_margin.
  double min_probability = 5;
  double min_margin = 6;
  // When unsure: "next" (ask the model classifier) or "ask" (ask the developer).
  string on_uncertain = 7;
  int32 timeout_ms = 8;
  // Catalog model (global) of the model classifier step; empty: the classifier / small slot.
  string llm_model = 9;
}

// Which decision step a user's override picks.
enum ClassifierChoice {
  // Follow the server default (GetClassifier).
  CLASSIFIER_CHOICE_UNSPECIFIED = 0;
  // No decision step: rules, then the model classifier.
  CLASSIFIER_CHOICE_NONE = 1;
  // The global classifier provider in provider_id.
  CLASSIFIER_CHOICE_PROVIDER = 2;
}

// A user's override of the server-default classifier. A choice that went stale (its provider or model was
// removed, disabled or hidden from the user) follows the server default again.
message ClassifierOverride {
  ClassifierChoice choice = 1;
  // With CLASSIFIER_CHOICE_PROVIDER: a global, enabled provider of the "classifier" group.
  string provider_id = 2;
  // Global model of the model classifier step for this user; empty: the server default. A chain step with
  // its own model (admin decision config) keeps it.
  string llm_model = 3;
}

message GetMyClassifierRequest {}

message GetMyClassifierResponse {
  ClassifierOverride mine = 1;
  // The server default as configured: the provider of the decision step ("" none) and the model classifier's
  // model ("" the classifier / small slot).
  string default_provider_id = 2;
  string default_llm_model = 3;
}

message SetMyClassifierRequest {
  // Replaces the caller's override; the zero value follows the server default in full.
  ClassifierOverride mine = 1;
}

message SetMyClassifierResponse {
  ClassifierOverride mine = 1;
  string default_provider_id = 2;
  string default_llm_model = 3;
}

message GetSlotsRequest {}

message GetSlotsResponse {
  // As configured: an empty slot follows the server default (ListModels has the effective ones).
  Slots slots = 1;
  // The caller may change them (admins).
  bool editable = 2;
  // What each slot resolves to while it is empty ("Server default"), for this caller's catalog.
  Slots defaults = 3;
}

message SetSlotsRequest {
  // Replaces main, small, plan and title; an empty one is cleared. Values are global model ids. The model
  // classifier's model is set with SetClassifier and is kept.
  Slots slots = 1;
}

message SetSlotsResponse {
  Slots slots = 1;
}

message GetSearchRequest {}

// Which search provider serves the caller's web searches.
message SearchSettings {
  // The server default as configured: a global search provider, or "searxng" (the built-in SearXNG), which
  // also applies when it is empty or went stale.
  string default_provider_id = 1;
  // The caller's own choice; empty follows the server default. A stale choice (the provider was removed,
  // disabled or hidden) reads as empty.
  string my_provider_id = 2;
  // What serves the caller's queries now.
  string effective_provider_id = 3;
  // The caller may change the server default (admins).
  bool editable = 4;
}

message GetSearchResponse {
  SearchSettings settings = 1;
}

message SetSearchDefaultRequest {
  // A global, enabled search provider, or "searxng"; empty: the built-in SearXNG.
  string provider_id = 1;
}

message SetSearchDefaultResponse {
  SearchSettings settings = 1;
}

message SetMySearchRequest {
  // A search provider the caller may use (global and enabled, or their own), or "searxng"; empty follows
  // the server default.
  string provider_id = 1;
}

message SetMySearchResponse {
  SearchSettings settings = 1;
}
