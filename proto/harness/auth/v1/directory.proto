syntax = "proto3";

package harness.auth.v1;

import "harness/auth/v1/admin.proto";
import "harness/auth/v1/auth.proto";

// DirectoryService: groups of users (for quotas and role mapping) and the tokens of SCIM provisioning clients. The SCIM
// protocol itself is plain HTTP under /scim/v2 (RFC 7644). Writes: admins. Reads: admins, auditors, and billing for groups.
service DirectoryService {
  // The caller's role and what it allows; any signed-in user.
  rpc GetMyAccess(GetMyAccessRequest) returns (GetMyAccessResponse);

  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc RenameGroup(RenameGroupRequest) returns (RenameGroupResponse);
  // Groups fed by a directory (source other than local) are refused: change them there.
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse);
  rpc SetGroupMembers(SetGroupMembersRequest) returns (SetGroupMembersResponse);

  rpc GetScimSettings(GetScimSettingsRequest) returns (GetScimSettingsResponse);
  rpc SetScimSettings(SetScimSettingsRequest) returns (SetScimSettingsResponse);
  // The token value is returned once, from CreateScimToken only.
  rpc CreateScimToken(CreateScimTokenRequest) returns (CreateScimTokenResponse);
  rpc RevokeScimToken(RevokeScimTokenRequest) returns (RevokeScimTokenResponse);
}

message GetMyAccessRequest {}

message GetMyAccessResponse {
  User.Role role = 1;
  // users.read, users.write, audit.read, usage.read, quotas.read, quotas.write, policy.read, policy.write, sign_in.read,
  // sign_in.write, directory.read, directory.write, limits.read, limits.write.
  repeated string capabilities = 2;
}

message Group {
  string id = 1;
  string name = 2;
  // "local", "scim", "sso" or "ldap".
  string source = 3;
  repeated string member_ids = 4;
}

message ListGroupsRequest {}

message ListGroupsResponse {
  repeated Group groups = 1;
}

message CreateGroupRequest {
  string name = 1;
}

message CreateGroupResponse {
  Group group = 1;
}

message RenameGroupRequest {
  string id = 1;
  string name = 2;
}

message RenameGroupResponse {
  Group group = 1;
}

message DeleteGroupRequest {
  string id = 1;
}

message DeleteGroupResponse {}

message SetGroupMembersRequest {
  string id = 1;
  repeated string user_ids = 2;
}

message SetGroupMembersResponse {
  Group group = 1;
}

message ScimToken {
  string id = 1;
  string name = 2;
  // RFC 3339, UTC.
  string created_at = 3;
  string last_used_at = 4;
}

message ScimSettings {
  // Group display name to role rules, applied when membership changes. Empty: roles are managed in Users.
  repeated GroupRoleMapping role_mappings = 1;
}

message GetScimSettingsRequest {}

message GetScimSettingsResponse {
  ScimSettings settings = 1;
  repeated ScimToken tokens = 2;
  // What to give the provisioning client, e.g. https://harness.example.com/scim/v2.
  string base_url = 3;
}

message SetScimSettingsRequest {
  ScimSettings settings = 1;
}

message SetScimSettingsResponse {
  ScimSettings settings = 1;
}

message CreateScimTokenRequest {
  string name = 1;
}

message CreateScimTokenResponse {
  ScimToken token = 1;
  // Shown once.
  string value = 2;
}

message RevokeScimTokenRequest {
  string id = 1;
}

message RevokeScimTokenResponse {}
