syntax = "proto3";

package harness.auth.v1;

import "harness/common/v1/object.proto";

// Device authorization for clients (CLI, desktop, SSH runners), modeled on RFC 8628.
// Web sign-in uses regular Better Auth sessions and is not part of this service.
//
// Tokens:
//   device_token (hdt_...) - only exchanged for access tokens; lives until revoked.
//                            Stored in the OS keychain, fallback ~/.harness/credentials.json (0600).
//   access_token (hat_...) - sent as `Authorization: Bearer` on every other call; ~1 hour; memory only.
// Clients refresh proactively 5 minutes before expiry, and once on UNAUTHENTICATED before retrying.
service DeviceAuthService {
  // Unauthenticated. Starts a device authorization.
  rpc StartDeviceAuth(StartDeviceAuthRequest) returns (StartDeviceAuthResponse);
  // Unauthenticated. Polled every `interval_seconds` until approved, denied or expired.
  rpc PollDeviceAuth(PollDeviceAuthRequest) returns (PollDeviceAuthResponse);
  // Unauthenticated (uses the device token). UNAUTHENTICATED means the device was revoked:
  // the client deletes its credentials and asks the user to sign in again.
  rpc RefreshAccessToken(RefreshAccessTokenRequest) returns (RefreshAccessTokenResponse);
  // The calling user's profile (and the calling device when authenticated with an access token).
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  // Changes the calling user's display name and/or avatar. Directory (LDAP) users cannot change their
  // name (the directory sets it at every sign-in): FAILED_PRECONDITION.
  rpc UpdateMe(UpdateMeRequest) returns (UpdateMeResponse);
  // Changes the calling user's local password. A wrong current password is INVALID_ARGUMENT; directory
  // (LDAP) users have no local password: FAILED_PRECONDITION. Attempts are limited per user.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // Revokes the calling device.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // Devices of the calling user (admins may pass user_id to list another user's devices), most recently seen
  // first. Device.current marks the device making the call.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  // Revokes a device of the calling user (admins: any device). Its refresh fails with UNAUTHENTICATED afterwards.
  // The calling device itself is refused with FAILED_PRECONDITION: it signs out with Logout instead.
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
}

message ListDevicesRequest {
  string user_id = 1;
}

message ListDevicesResponse {
  repeated Device devices = 1;
}

message RevokeDeviceRequest {
  string device_id = 1;
}

message RevokeDeviceResponse {}

message StartDeviceAuthRequest {
  string client_name = 1;
  string device_name = 2;
  string os = 3;
  string arch = 4;
  string client_version = 5;
}

message StartDeviceAuthResponse {
  string device_code = 1;
  // Short code the user confirms in the browser, e.g. "WDJB-MJHT".
  string user_code = 2;
  string verification_uri = 3;
  string verification_uri_complete = 4;
  int32 expires_in_seconds = 5;
  int32 interval_seconds = 6;
}

message PollDeviceAuthRequest {
  string device_code = 1;
}

message PollDeviceAuthResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_PENDING = 1;
    // Increase the polling interval by 5 seconds.
    STATUS_SLOW_DOWN = 2;
    STATUS_APPROVED = 3;
    STATUS_DENIED = 4;
    STATUS_EXPIRED = 5;
  }
  Status status = 1;
  // Set only when status = STATUS_APPROVED.
  DeviceCredentials credentials = 2;
}

message DeviceCredentials {
  string device_id = 1;
  string device_token = 2;
  string access_token = 3;
  int32 access_expires_in_seconds = 4;
  User user = 5;
}

message RefreshAccessTokenRequest {
  string device_token = 1;
}

message RefreshAccessTokenResponse {
  string access_token = 1;
  int32 access_expires_in_seconds = 2;
}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
  Device device = 2;
}

message UpdateMeRequest {
  // Unset: unchanged. 1-100 characters after trimming.
  optional string name = 1;
  // Unset: unchanged; "": removes the avatar. Otherwise a data URL of a PNG, JPEG or WebP image
  // ("data:image/png;base64,..."), at most 256x256 pixels and 200 KB decoded. The client resizes before
  // uploading; the server checks the type (by content, not only the declared one), size and dimensions.
  optional string image = 2;
}

message UpdateMeResponse {
  User user = 1;
}

message ChangePasswordRequest {
  string current_password = 1;
  // 8-128 characters.
  string new_password = 2;
  // Also signs out the user's web sessions and every other device; the calling device stays signed in.
  bool revoke_other_sessions = 3;
}

message ChangePasswordResponse {}

message LogoutRequest {}

message LogoutResponse {}

message User {
  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_USER = 1;
    ROLE_ADMIN = 2;
    // Reads everything an admin can read (users, audit log, usage, quotas, policy, sign-in settings) and changes nothing.
    ROLE_AUDITOR = 3;
    // Reads usage and sets spend quotas; no other administration.
    ROLE_BILLING = 4;
  }
  string id = 1;
  string email = 2;
  string name = 3;
  Role role = 4;
  // Profile fields, set by GetMe and UpdateMe (empty elsewhere).
  // Sign-in handle; empty when the account has none.
  string username = 5;
  // Avatar as a data URL (see UpdateMeRequest.image); empty when none is set.
  string image = 6;
  UserSource source = 7;
  // RFC 3339, UTC. last_sign_in_at is the latest web sign-in (devices are approved from one); empty when never.
  string created_at = 8;
  string last_sign_in_at = 9;
  // The avatar in the object store, set with image once it has moved there: a frontend reads it through the object
  // route. image stays for frontends older than the store.
  harness.common.v1.ObjectRef image_object = 10;
}

enum UserSource {
  USER_SOURCE_UNSPECIFIED = 0;
  // A local account with a password.
  USER_SOURCE_LOCAL = 1;
  // Signs in through LDAP; no local password.
  USER_SOURCE_LDAP = 2;
  // Signs in through an OIDC or SAML identity provider; no local password.
  USER_SOURCE_SSO = 3;
  // Created by a SCIM provisioning client; no local password until they sign in through SSO or get one.
  USER_SOURCE_SCIM = 4;
}

message Device {
  string id = 1;
  string name = 2;
  string os = 3;
  string arch = 4;
  // RFC 3339, UTC.
  string created_at = 5;
  string last_seen_at = 6;
  // The device making the call (ListDevices).
  bool current = 7;
  // The client program that signed in, e.g. "harness-client"; empty when unknown.
  string client_name = 8;
}
