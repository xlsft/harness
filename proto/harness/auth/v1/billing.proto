syntax = "proto3";

package harness.auth.v1;

import "harness/auth/v1/auth.proto";

// BillingService: the spend limits admins set (per user, group and role, plus the budget of one session) and usage as CSV.
// Reads: admins, auditors and billing. Writes: admins and billing. These are the organization's quotas; a user's own
// providers and their limits are a different thing, seen by that user only: their spend counts towards none of this.
service BillingService {
  rpc GetQuotas(GetQuotasRequest) returns (GetQuotasResponse);
  // Sets or clears (no field set) one user's, group's or role's limits.
  rpc SetUserQuota(SetUserQuotaRequest) returns (SetUserQuotaResponse);
  rpc SetGroupQuota(SetGroupQuotaRequest) returns (SetGroupQuotaResponse);
  rpc SetRoleQuota(SetRoleQuotaRequest) returns (SetRoleQuotaResponse);
  rpc SetSessionBudget(SetSessionBudgetRequest) returns (SetSessionBudgetResponse);
  // A user's limits as they apply, with where they come from and the spend against them.
  rpc GetUserQuota(GetUserQuotaRequest) returns (GetUserQuotaResponse);
  // The caller's own: any signed-in user.
  rpc GetMyQuota(GetMyQuotaRequest) returns (GetMyQuotaResponse);
  // Usage records as CSV. Admins, auditors and billing see everyone (records on personal providers without model or
  // provider); everyone else only themselves.
  rpc ExportUsageCsv(ExportUsageCsvRequest) returns (ExportUsageCsvResponse);
}

// Unset: no limit at this level. A limit of 0 blocks all spending.
message QuotaLimits {
  optional double daily_usd = 1;
  optional double monthly_usd = 2;
  // Object store quota in bytes; negative: unlimited.
  optional int64 objects_bytes = 3;
}

message UserQuota {
  string user_id = 1;
  QuotaLimits limits = 2;
}

message GroupQuota {
  string group_id = 1;
  QuotaLimits limits = 2;
}

message RoleQuota {
  User.Role role = 1;
  QuotaLimits limits = 2;
}

message GetQuotasRequest {}

message GetQuotasResponse {
  repeated UserQuota users = 1;
  repeated GroupQuota groups = 2;
  repeated RoleQuota roles = 3;
  optional double session_usd = 4;
}

message SetUserQuotaRequest {
  string user_id = 1;
  QuotaLimits limits = 2;
}

message SetUserQuotaResponse {}

message SetGroupQuotaRequest {
  string group_id = 1;
  QuotaLimits limits = 2;
}

message SetGroupQuotaResponse {}

message SetRoleQuotaRequest {
  User.Role role = 1;
  QuotaLimits limits = 2;
}

message SetRoleQuotaResponse {}

message SetSessionBudgetRequest {
  // Unset clears it.
  optional double session_usd = 1;
}

message SetSessionBudgetResponse {}

message GetUserQuotaRequest {
  string user_id = 1;
}

message GetUserQuotaResponse {
  UserQuotaStatus status = 1;
}

message GetMyQuotaRequest {}

message GetMyQuotaResponse {
  UserQuotaStatus status = 1;
}

message UserQuotaStatus {
  // What is set for this user directly.
  QuotaLimits own = 1;
  // What applies: their own limit, else the strictest of their groups', else their role's.
  QuotaLimits effective = 2;
  // "user", "group:<name>", "role" or empty, for each period.
  string daily_source = 3;
  string monthly_source = 4;
  // Spend against the limits, in UTC calendar periods. Personal providers do not count.
  double daily_spent_usd = 5;
  double monthly_spent_usd = 6;
}

message ExportUsageCsvRequest {
  // RFC 3339. Empty: the last 30 days.
  string from = 1;
  string to = 2;
  // One user; empty: everyone the caller may see.
  string user_id = 3;
  // Only members of this group.
  string group_id = 4;
}

message ExportUsageCsvResponse {
  bytes csv = 1;
  int32 rows = 2;
  bool truncated = 3;
}
