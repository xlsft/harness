name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. ...
        2. ...
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Desktop app
        - Web UI
        - Terminal UI
        - Headless client
        - Server
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings > About, or `harness-client --version`.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and provider
      placeholder: claude-sonnet-5-5 on Anthropic, or an ACP agent
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Check them for keys and private paths first.
      render: text
