name: image

# Single-container server image (deploy/Dockerfile, docs/PLAN.md §1.7).
# main and pull requests: build both architectures, start the amd64 one, push nothing. Release calls this with a version
# and it also pushes ghcr.io/xlsft/harness:<version>, signed, with an SBOM and provenance. The moving tags (X.Y and latest)
# follow only when the rest of the release succeeded, in Release's publish job.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version, e.g. 0.2.0 or 0.2.0-rc.1
        type: string
        required: true
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'packages/core/**'
      - '.dockerignore'
      - 'scripts/e2e/image-smoke.sh'
      - '.github/workflows/image.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - 'packages/core/**'
      - '.dockerignore'
      - 'scripts/e2e/image-smoke.sh'
      - '.github/workflows/image.yml'

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write # keyless Sigstore signature of the image

    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for this runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: harness-smoke:ci
          build-args: HARNESS_VERSION=${{ inputs.version || '0.0.0-dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Starts it: the amd64 path of the checksum-pinned downloads, and that the image runs here at all.
      - name: Smoke test
        run: scripts/e2e/image-smoke.sh harness-smoke:ci "${VERSION:-0.0.0-dev}"

      - name: Log in to ghcr.io
        if: inputs.version != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=ref,event=branch
            type=ref,event=pr

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        if: inputs.version != ''

      - name: Build both architectures (and push for a release)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.version != '' }}
          sbom: ${{ inputs.version != '' }}
          provenance: ${{ inputs.version != '' && 'mode=max' || 'false' }}
          build-args: HARNESS_VERSION=${{ inputs.version || '0.0.0-dev' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign
        if: inputs.version != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Summary
        if: inputs.version != ''
        run: echo "Pushed and signed $IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
