name: sdk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/sdk-ts/**', '.github/workflows/sdk.yml']
  pull_request:
    paths: ['packages/sdk-ts/**', '.github/workflows/sdk.yml']

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test
        working-directory: packages/sdk-ts
        run: npm test
