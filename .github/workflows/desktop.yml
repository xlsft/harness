name: desktop

# The macOS app. Pull requests: its tests and a bundle for Apple Silicon, signed ad-hoc. Release calls this with a version
# for both architectures and keeps the results as artifacts for its publish job. Signing and notarization happen only with
# their secrets, and the release builds without them (packages/desktop/scripts/build-release.sh, docs/release.md).
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version, e.g. 0.2.0 or 0.2.0-rc.1
        type: string
        required: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
  push:
    branches: [main]
    paths: ['packages/desktop/**', 'packages/client/computeruse/helper/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['packages/desktop/**', 'packages/client/computeruse/helper/**', '.github/workflows/desktop.yml']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    # Intel cross-compiles on the same runner, since Rust, Go and swiftc all can.
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(inputs.version != '' && '[{"target":"aarch64-apple-darwin","arch":"arm64"},{"target":"x86_64-apple-darwin","arch":"amd64"}]' || '[{"target":"aarch64-apple-darwin","arch":"arm64"}]') }}
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      VERSION: ${{ inputs.version }}
      TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stamp the version
        if: inputs.version != ''
        run: node scripts/release/stamp.mjs "$VERSION"

      - name: Install go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/client/go.mod
          cache-dependency-path: packages/client/go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: packages/desktop/package.json

      - name: Install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            packages/desktop/pnpm-lock.yaml
            packages/ui/pnpm-lock.yaml

      - name: Install the Rust target
        run: rustup target add "$TARGET"

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: |
          pnpm --dir packages/ui install --frozen-lockfile
          pnpm --dir packages/desktop install --frozen-lockfile

      # Only for the architecture the runner can run. The fake release server of these tests is real HTTP on loopback.
      - name: Test the updater
        if: matrix.arch == 'arm64'
        run: |
          bash packages/desktop/scripts/build-sidecar.sh
          cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml

      - name: Build
        env:
          HARNESS_VERSION: ${{ inputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash packages/desktop/scripts/build-release.sh "$TARGET" "$RUNNER_TEMP/release"

      - name: Keep for the release
        if: inputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-desktop-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7
