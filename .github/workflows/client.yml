name: client

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ['packages/client/**', '.github/workflows/client.yml']
  pull_request:
    paths: ['packages/client/**', '.github/workflows/client.yml']

permissions:
  contents: read

# A new push cancels older checks of its branch; a release's are never cancelled.
concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: packages/client

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/client/go.mod
          cache-dependency-path: packages/client/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  # Keeps every platform compiling. Only macOS goes out in a release, through .goreleaser.yaml.
  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]

    defaults:
      run:
        working-directory: packages/client

    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      BIN: harness-client-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/client/go.mod
          cache-dependency-path: packages/client/go.sum

      - name: Build
        run: go build -trimpath -ldflags='-s -w' -o "dist/$BIN" ./cmd/harness-client

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BIN }}
          path: packages/client/dist/${{ env.BIN }}
          if-no-files-found: error
          retention-days: 7
