name: e2e

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/core/**', 'packages/client/**', 'scripts/e2e/**', '.github/workflows/e2e.yml']
  pull_request:
    paths: ['packages/core/**', 'packages/client/**', 'scripts/e2e/**', '.github/workflows/e2e.yml']

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  e2e:
    # core + client against a scripted upstream: device login, admin setup, one tool-using turn.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/client/go.mod
          cache-dependency-path: packages/client/go.sum
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: packages/core/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/core/pnpm-lock.yaml
      - name: Run end-to-end test
        run: scripts/e2e/run.sh
