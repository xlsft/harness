<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Artifacts page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; padding: {{pad}}; background: #000; color: #d4d4d4; font-family: 'Cascadia Mono', 'Cascadia Code', 'JetBrains Mono', monospace; font-size: 13px; display: flex; flex-direction: column; gap: 24px">

<sc-for list="{{panels}}" as="p" hint-placeholder-count="1">
<div style="display: flex; flex-direction: column; gap: 6px">
  <sc-if value="{{all}}" hint-placeholder-val="{{true}}"><div style="font-size: 11px; color: #8f8f8f">{{p.label}}</div></sc-if>
  <section aria-label="Artifacts" style="height: {{p.h}}; overflow: hidden; background: #000; border: {{p.frame}}">
    <div style="max-width: 1080px; margin: 0 auto; padding: 40px 40px 0; display: flex; flex-direction: column; gap: 22px">

      <h1 style="margin: 0; font-family: 'Cascadia Code', monospace; font-size: 26px; font-weight: 700; color: #fff">Artifacts</h1>

      <div style="display: flex; align-items: center; gap: 4px; flex-wrap: wrap">
        <div role="tablist" aria-label="Filter" style="display: flex; gap: 2px">
          <button role="tab" aria-selected="true" style="background: #1c1c1c; border: 1px solid #2b2b2b; color: #fff; font: inherit; font-size: 12.5px; padding: 5px 12px">All</button>
          <button role="tab" aria-selected="false" style="background: none; border: 1px solid transparent; color: #d4d4d4; font: inherit; font-size: 12.5px; padding: 5px 12px">Yours</button>
          <button role="tab" aria-selected="false" style="background: none; border: 1px solid transparent; color: #d4d4d4; font: inherit; font-size: 12.5px; padding: 5px 12px">Shared with you</button>
        </div>
        <span style="flex: 1"></span>
        <button aria-label="Search" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #d4d4d4"><svg viewBox="0 0 24 24" style="width: 16px; height: 16px; fill: currentColor" aria-hidden="true"><path d="{{ic.search}}"></path></svg></button>
        <button aria-label="Filter and sort" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #d4d4d4"><svg viewBox="0 0 24 24" style="width: 16px; height: 16px; fill: currentColor" aria-hidden="true"><path d="{{ic.filter}}"></path></svg></button>
        <button aria-label="{{p.viewLabel}}" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #d4d4d4"><svg viewBox="0 0 24 24" style="width: 16px; height: 16px; fill: currentColor" aria-hidden="true"><path d="{{p.viewIcon}}"></path></svg></button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 12px; color: #8f8f8f">Make something new</span>
        <div style="display: flex; gap: 14px; flex-wrap: wrap">
          <sc-for list="{{kinds}}" as="k" hint-placeholder-count="4">
            <a href="#" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #fff; width: 150px">
              <span style="height: 92px; background: {{k.tint}}; border: 1px solid {{k.c}}; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" style="width: 34px; height: 34px; fill: {{k.c}}" aria-hidden="true"><path d="{{k.icon}}"></path></svg></span>
              <span style="display: flex; align-items: center; gap: 8px; font-size: 12.5px">{{k.n}}<span style="font-size: 10px; color: {{k.bc}}; border: 1px solid {{k.bc}}; padding: 0 5px">{{k.b}}</span></span>
            </a>
          </sc-for>
        </div>
      </div>

      <sc-if value="{{p.grid}}" hint-placeholder-val="{{true}}">
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding-top: 8px">
          <sc-for list="{{gridItems}}" as="it" hint-placeholder-count="6">
            <a href="#" style="display: flex; flex-direction: column; border: 1px solid #2b2b2b; background: #0a0a0a; text-decoration: none; color: #d4d4d4">

                <div style="width: 100%; height: 112px; background: {{it.paper}}; border: 1px solid #2b2b2b; border-bottom: 0; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 7px">
                  <sc-if value="{{it.isDesign}}" hint-placeholder-val="{{false}}">
                    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; flex: 1"><span style="background: #1c1c1c"></span><span style="background: #1c1c1c"></span><span style="background: #1c1c1c"></span><span style="background: #131313"></span><span style="background: #131313"></span><span style="background: #131313"></span></div>
                  </sc-if>
                  <sc-if value="{{it.isPage}}" hint-placeholder-val="{{false}}">
                    <span style="height: 8px; width: 40%; background: {{it.c}}"></span><span style="height: 14px; width: 70%; background: #2b2b2b"></span><span style="height: 5px; width: 90%; background: #1c1c1c"></span><span style="height: 5px; width: 80%; background: #1c1c1c"></span><span style="height: 5px; width: 85%; background: #1c1c1c"></span>
                  </sc-if>
                  <sc-if value="{{it.isDoc}}" hint-placeholder-val="{{false}}">
                    <span style="font-family: 'Cascadia Code', monospace; font-size: 12px; color: #fff; line-height: 1.3">{{it.title}}</span><span style="height: 4px; width: 92%; background: #1c1c1c"></span><span style="height: 4px; width: 86%; background: #1c1c1c"></span><span style="height: 4px; width: 90%; background: #1c1c1c"></span>
                  </sc-if>
                  <sc-if value="{{it.isDash}}" hint-placeholder-val="{{false}}">
                    <div style="flex: 1; display: flex; align-items: flex-end; gap: 6px"><span style="flex: 1; height: 40%; background: {{it.c}}"></span><span style="flex: 1; height: 70%; background: {{it.c}}"></span><span style="flex: 1; height: 55%; background: {{it.c}}"></span><span style="flex: 1; height: 90%; background: {{it.c}}"></span><span style="flex: 1; height: 65%; background: {{it.c}}"></span></div>
                  </sc-if>
                </div>
              </div>
              <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px">
                <span style="width: 32px; height: 32px; flex-shrink: 0; background: {{it.tint}}; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" style="width: 15px; height: 15px; fill: {{it.c}}" aria-hidden="true"><path d="{{it.icon}}"></path></svg></span>
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="color: #fff; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{it.title}}</span><span style="color: #8f8f8f; font-size: 11.5px">{{it.when}}</span></span>
                <svg viewBox="0 0 24 24" style="width: 15px; height: 15px; flex-shrink: 0; fill: {{it.globeFill}}" aria-label="{{it.sharedLabel}}"><path d="{{ic.globe}}"></path></svg>
              </div>
            </a>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{p.list}}" hint-placeholder-val="{{false}}">
        <div role="list" style="display: flex; flex-direction: column; padding-top: 8px">
          <sc-for list="{{items}}" as="it" hint-placeholder-count="12">
            <div role="listitem" style="display: flex; align-items: center; gap: 12px; height: 46px; border-bottom: 1px solid #1c1c1c">
              <span style="width: 28px; height: 28px; flex-shrink: 0; background: {{it.tint}}; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" style="width: 14px; height: 14px; fill: {{it.c}}" aria-hidden="true"><path d="{{it.icon}}"></path></svg></span>
              <a href="#" style="flex: 1; min-width: 0; color: #fff; text-decoration: none; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{it.title}}</a>
              <span style="color: #8f8f8f; font-size: 12px; white-space: nowrap">{{it.when}}</span>
              <svg viewBox="0 0 24 24" style="width: 15px; height: 15px; flex-shrink: 0; fill: {{it.globeFill}}" aria-label="{{it.sharedLabel}}"><path d="{{ic.globe}}"></path></svg>
              <button aria-label="More actions" style="width: 30px; height: 30px; margin-left: 12px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #8f8f8f"><svg viewBox="0 0 24 24" style="width: 15px; height: 15px; fill: currentColor" aria-hidden="true"><path d="{{ic.more}}"></path></svg></button>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </section>
</div>
</sc-for>

</div>
</x-dc>
