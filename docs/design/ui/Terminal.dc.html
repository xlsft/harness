<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terminal pane</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; padding: {{pad}}; background: #000; color: #d4d4d4; font-family: 'Cascadia Mono', 'Cascadia Code', 'JetBrains Mono', monospace; font-size: 13px; display: flex; flex-direction: column; gap: 24px">

<sc-for list="{{panels}}" as="p" hint-placeholder-count="1">
<div style="display: flex; flex-direction: column; gap: 6px">
  <sc-if value="{{all}}" hint-placeholder-val="{{true}}"><div style="font-size: 11px; color: #8f8f8f">{{p.label}}</div></sc-if>
  <section aria-label="Terminal" style="height: {{p.h}}; display: flex; flex-direction: column; background: #000; border: {{p.frame}}; position: relative; overflow: hidden">

    <div style="height: 44px; flex-shrink: 0; display: flex; align-items: stretch; border-bottom: 1px solid #2b2b2b; padding: 0 6px 0 0">
      <div style="display: flex; align-items: center; padding: 0 12px; color: #fff; font-family: 'Cascadia Code', monospace; font-size: 13px">Terminal</div>
      <div role="tablist" aria-label="Terminal tabs" style="display: flex; align-items: stretch; min-width: 0; overflow: hidden">
        <sc-for list="{{p.tabs}}" as="t" hint-placeholder-count="3">
          <button role="tab" aria-selected="{{t.sel}}" style="display: flex; align-items: center; gap: 7px; padding: 0 10px; background: {{t.bg}}; color: {{t.fg}}; border: 0; border-left: 1px solid #2b2b2b; border-bottom: 2px solid {{t.line}}; font: inherit; font-size: 12px; white-space: nowrap">
            <svg viewBox="0 0 24 24" style="width: 13px; height: 13px; fill: currentColor" aria-hidden="true"><path d="{{ic.term}}"></path></svg>{{t.n}}<span style="color: {{t.sc}}; font-size: 11px">{{t.st}}</span>
            <svg viewBox="0 0 24 24" style="width: 11px; height: 11px; fill: {{t.xc}}" aria-hidden="true"><path d="{{ic.close}}"></path></svg>
          </button>
        </sc-for>
        <button aria-label="New terminal tab" style="width: 36px; display: flex; align-items: center; justify-content: center; background: none; border: 0; border-left: 1px solid #2b2b2b; border-right: 1px solid #2b2b2b; color: #8f8f8f"><svg viewBox="0 0 24 24" style="width: 15px; height: 15px; fill: currentColor" aria-hidden="true"><path d="{{ic.plus}}"></path></svg></button>
      </div>
      <span style="flex: 1"></span>
      <div style="display: flex; align-items: center; gap: 2px">
        <button aria-label="Terminal settings" style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background: {{p.moreBg}}; border: 0; color: #fff"><svg viewBox="0 0 24 24" style="width: 15px; height: 15px; fill: currentColor" aria-hidden="true"><path d="{{ic.more}}"></path></svg></button>
        <button aria-label="Maximize" style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #8f8f8f"><svg viewBox="0 0 24 24" style="width: 15px; height: 15px; fill: currentColor" aria-hidden="true"><path d="{{ic.full}}"></path></svg></button>
        <button aria-label="Close terminal" style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #8f8f8f"><svg viewBox="0 0 24 24" style="width: 15px; height: 15px; fill: currentColor" aria-hidden="true"><path d="{{ic.close}}"></path></svg></button>
      </div>
    </div>

    <sc-if value="{{p.agent}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; align-items: center; gap: 9px; padding: 6px 12px; border-bottom: 1px solid #2b2b2b; background: #0a0a0a; font-size: 12px; color: #8f8f8f">
        <svg viewBox="0 0 24 24" style="width: 14px; height: 14px; fill: {{accent}}" aria-hidden="true"><path d="{{ic.ai}}"></path></svg>
        Started by the agent · background task<span style="flex: 1"></span><span style="color: {{accent}}">running · 2m 14s</span>
        <button style="background: none; border: 1px solid #2b2b2b; color: #ff2056; font: inherit; font-size: 11px; padding: 1px 8px">Stop</button>
      </div>
    </sc-if>

    <pre style="margin: 0; flex: 1; min-height: 0; overflow: hidden; padding: 12px 14px; font-family: inherit; font-size: 12.5px; line-height: 1.6; color: #d4d4d4; white-space: pre-wrap"><sc-for list="{{p.lines}}" as="l" hint-placeholder-count="12"><span style="display: block; color: {{l.c}}; min-height: 1.6em">{{l.t}}<sc-if value="{{l.cur}}" hint-placeholder-val="{{false}}"><span style="display: inline-block; width: 8px; height: 15px; background: {{accent}}; vertical-align: -3px"></span></sc-if></span></sc-for></pre>

    <sc-if value="{{p.exited}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; align-items: center; gap: 9px; padding: 8px 12px; border-top: 1px solid #2b2b2b; border-left: 2px solid #ff2056; font-size: 12px; color: #8f8f8f">
        Process exited with code <span style="color: #ff2056">1</span><span style="flex: 1"></span>
        <button style="background: none; border: 1px solid #2b2b2b; color: #fff; font: inherit; font-size: 11px; padding: 2px 9px">Restart</button>
        <button style="background: none; border: 1px solid #2b2b2b; color: #fff; font: inherit; font-size: 11px; padding: 2px 9px">Send output to chat</button>
      </div>
    </sc-if>

    <sc-if value="{{p.menu}}" hint-placeholder-val="{{false}}">
      <div role="menu" aria-label="Cursor style" style="position: absolute; top: 46px; right: 304px; width: 170px; background: #131313; border: 1px solid #454545; padding: 4px; font-size: 12.5px">
        <div role="menuitemradio" aria-checked="true" style="display: flex; align-items: center; padding: 6px 9px; color: #fff">Block<span style="flex: 1"></span><svg viewBox="0 0 24 24" style="width: 14px; height: 14px; fill: {{accent}}" aria-hidden="true"><path d="{{ic.check}}"></path></svg></div>
        <div role="menuitemradio" aria-checked="false" style="display: flex; align-items: center; padding: 6px 9px; color: #d4d4d4">Bar</div>
        <div role="menuitemradio" aria-checked="false" style="display: flex; align-items: center; padding: 6px 9px; color: #d4d4d4">Underline</div>
      </div>
      <div role="menu" aria-label="Terminal settings" style="position: absolute; top: 46px; right: 40px; width: 260px; background: #131313; border: 1px solid #454545; padding: 4px; font-size: 12.5px">
        <div role="menuitem" style="display: flex; align-items: center; gap: 8px; padding: 6px 9px; color: #fff; background: #1c1c1c; border-left: 2px solid {{accent}}">Cursor style<span style="flex: 1"></span><span style="color: #8f8f8f">Block</span><svg viewBox="0 0 24 24" style="width: 12px; height: 12px; fill: #8f8f8f" aria-hidden="true"><path d="{{ic.right}}"></path></svg></div>
        <div role="menuitemcheckbox" aria-checked="true" style="display: flex; align-items: center; gap: 8px; padding: 6px 9px; color: #d4d4d4">Blink cursor<span style="flex: 1"></span><svg viewBox="0 0 24 24" style="width: 14px; height: 14px; fill: {{accent}}" aria-hidden="true"><path d="{{ic.check}}"></path></svg></div>
        <div role="menuitemcheckbox" aria-checked="false" style="display: flex; align-items: center; gap: 8px; padding: 6px 9px; color: #d4d4d4">Copy on select</div>
        <div role="menuitem" style="display: flex; align-items: center; gap: 8px; padding: 6px 9px; color: #d4d4d4">Font size<span style="flex: 1"></span><span style="color: #8f8f8f">12.5</span><svg viewBox="0 0 24 24" style="width: 12px; height: 12px; fill: #8f8f8f" aria-hidden="true"><path d="{{ic.right}}"></path></svg></div>
        <div role="menuitem" style="display: flex; align-items: center; gap: 8px; padding: 6px 9px; color: #d4d4d4">Scrollback<span style="flex: 1"></span><span style="color: #8f8f8f">10,000 lines</span><svg viewBox="0 0 24 24" style="width: 12px; height: 12px; fill: #8f8f8f" aria-hidden="true"><path d="{{ic.right}}"></path></svg></div>
        <div style="height: 1px; background: #2b2b2b; margin: 4px 0"></div>
        <div role="menuitem" style="display: flex; align-items: center; gap: 8px; padding: 6px 9px; color: #d4d4d4">Clear<span style="flex: 1"></span><span style="color: #8f8f8f; font-size: 11px">⌘K</span></div>
        <div role="menuitem" style="display: flex; align-items: center; gap: 8px; padding: 6px 9px; color: #d4d4d4">Rename tab</div>
        <div role="menuitem" style="display: flex; align-items: center; gap: 8px; padding: 6px 9px; color: #ff2056">Kill process</div>
      </div>
    </sc-if>
  </section>
</div>
</sc-for>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["all","menu","session","agent","exited"],"default":"all"},"height":{"editor":null,"default":"900px"},"framed":{"editor":"boolean","default":true},"accent":{"editor":"color","default":"#2b7fff"},"inset":{"editor":"boolean","default":true},"$preview":{"width":640,"height":2500}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? 'all';
    const all = v === 'all';
    const a = this.props.accent ?? '#2b7fff';
    const G = '#8f8f8f', W = '#fff', T = '#d4d4d4', OK = '#00bc7d', BAD = '#ff2056', WARN = '#fe9a00';
    const L = (t, c, cur) => ({ t, c: c ?? T, cur: !!cur });
    const prompt = (time, cmd, cur) => [L('╭ ' + time + ' │ ~/Projects/xlsft/harness │ main ?2', G), L('╰ ❯ ' + cmd, W, cur)];
    const harness = [
      ...prompt('16:41', 'pnpm --filter core test'),
      L(' RUN  v3.2.4 /packages/core', a),
      L(' ✓ gateway/translate.test.ts (14) 212ms', OK),
      L(' ✓ gateway/stream.test.ts (6) 1.4s', OK),
      L(' ↓ gateway/retry.test.ts (3)', WARN),
      L(''),
      L(' Test Files  2 passed | 1 skipped (3)'),
      L('      Tests  20 passed | 3 skipped (23)'),
      L('   Duration  2.31s', G),
      L(''),
      ...prompt('16:42', 'git status -s'),
      L(' M packages/core/server/gateway/translate.ts', WARN),
      L('?? packages/core/server/gateway/translate.test.ts', BAD),
      L('?? packages/client/', BAD),
      L(''),
      ...prompt('16:42', '', true)
    ];
    const dev = [
      L('$ pnpm --filter core dev', G),
      L(''),
      L('  ➜ Local:   http://localhost:3000/', a),
      L('  ✔ Nitro built in 412 ms', OK),
      L('  ℹ POST /gateway.v1.Gateway/Stream 200 — 3.4s'),
      L('  ℹ POST /gateway.v1.Gateway/Stream 200 — 2.9s'),
      L('  ⚠ provider ollama: no usage in stream, estimating', WARN),
      L('  ℹ POST /gateway.v1.Gateway/Stream 200 — 61.2s'),
      L('', T, true)
    ];
    const gotest = [
      ...prompt('16:39', 'cd packages/client && go test ./loop'),
      L('=== RUN   TestLoopToolCalls'),
      L('=== RUN   TestLoopToolCalls/parallel_reads'),
      L('    loop_test.go:41: expected 3 tool calls, got 2', BAD),
      L('--- FAIL: TestLoopToolCalls (0.02s)', BAD),
      L('FAIL', BAD),
      L('FAIL    harness/client/loop  0.214s', BAD)
    ];
    const tabs = (sel) => [
      { n: 'harness', st: '', sc: G },
      { n: 'core dev', st: '●', sc: a },
      { n: 'go test', st: '1', sc: BAD }
    ].map((t, i) => ({ ...t, sel: i === sel ? 'true' : 'false', bg: i === sel ? '#0a0a0a' : 'transparent', fg: i === sel ? W : G, line: i === sel ? a : 'transparent', xc: i === sel ? G : 'transparent' }));
    const h = all ? '560px' : (this.props.height ?? '900px');
    const frame = all || this.props.framed !== false ? '1px solid #2b2b2b' : '0';
    const P = (key, label, sel, lines, extra) => ({ key, label, h, frame, tabs: tabs(sel), lines, menu: false, agent: false, exited: false, moreBg: 'transparent', ...extra });
    const panels = [
      P('menu', 'variant="menu" · settings menu with cursor-style submenu', 0, harness, { menu: true, moreBg: '#1c1c1c' }),
      P('session', 'variant="session" · shell tab, prompt waiting', 0, harness),
      P('agent', 'variant="agent" · tab started by the agent, still running', 1, dev, { agent: true }),
      P('exited', 'variant="exited" · process exited non-zero', 2, gotest, { exited: true })
    ].filter((p) => all || p.key === v);
    return {
      accent: a,
      pad: this.props.inset === false ? '0' : '24px',
      all,
      panels,
      ic: {
        term: 'M11.741 18.966c-1.098-.294-.945-1.887.259-1.966h8c.543.036 1 .428 1 1s-.457.964-1 1h-8ZM8.586 12l-4.95-4.95c-.574-.654-.22-1.707.707-1.707c.278 0 .503.114.707.293l5.657 5.657c.179.204.293.429.293.707s-.114.503-.293.707L5.05 18.364c-.339.298-.8.394-1.207.159c-.588-.34-.629-1.092-.207-1.573Z',
        close: 'M10.586 12.001L4.929 6.344c-.359-.41-.404-1.01 0-1.414c.404-.405 1.005-.359 1.414 0L12 10.586l5.657-5.656c.409-.359 1.01-.404 1.414 0s.359 1.005 0 1.414l-5.657 5.657l5.657 5.656c.359.41.404 1.011 0 1.415s-1.005.359-1.414 0L12 13.415l-5.657 5.657c-.409.359-1.01.404-1.414 0s-.359-1.005 0-1.414Z',
        plus: 'M13 13v6c-.036.543-.428 1-1 1s-.964-.457-1-1v-6H5c-.543-.036-1-.428-1-1s.457-.964 1-1h6V5c.036-.543.428-1 1-1s.964.457 1 1v6h6c.543.036 1 .428 1 1s-.457.964-1 1Z',
        more: 'm18.475 10.564l.418.216c.985.72.742 2.274-.418 2.656l-.475.077l-.475-.077l-.418-.216c-.985-.72-.742-2.274.418-2.656l.475-.077Zm-6 0l.418.216c.985.72.742 2.274-.418 2.656l-.475.077l-.475-.077l-.418-.216c-.985-.72-.742-2.274.418-2.656l.475-.077Zm-6 0l.418.216c.985.72.742 2.274-.418 2.656L6 13.513l-.475-.077l-.418-.216c-.985-.72-.742-2.274.418-2.656L6 10.487Z',
        full: 'm5 17.586l4.793-4.793c.409-.359 1.01-.404 1.414 0s.359 1.005 0 1.414L6.414 19H9c1.204.079 1.357 1.672.259 1.966L9 21H4c-.271-.018-.511-.096-.707-.293c-.197-.196-.275-.436-.293-.707v-5l.034-.259C3.328 13.643 4.921 13.796 5 15ZM17.586 5H15c-1.204-.079-1.357-1.672-.259-1.966L15 3h5c.271.018.511.096.707.293c.197.196.275.436.293.707v5l-.034.259c-.294 1.098-1.887.945-1.966-.259V6.414l-4.793 4.793c-.409.359-1.01.404-1.414 0s-.359-1.005 0-1.414Z',
        check: 'M9.171 16.072L19.778 5.465c.409-.359 1.01-.404 1.414 0c.404.405.359 1.005 0 1.415L9.878 18.193c-.204.179-.429.293-.707.293s-.503-.114-.707-.293l-5.657-5.657c-.297-.339-.393-.8-.159-1.207c.34-.588 1.092-.629 1.574-.207Z',
        right: 'm13.586 12l-4.95-4.95c-.574-.654-.22-1.707.707-1.707c.278 0 .503.114.707.293l5.657 5.657c.179.204.293.429.293.707s-.114.503-.293.707l-5.657 5.657c-.339.298-.8.394-1.207.159c-.588-.34-.629-1.092-.207-1.573Z',
        ai: 'M11.114 4.101c.827.047 1.486.587 1.779 1.347l.797 2.336c.146.395.323.762.573 1.102c.4.542.936.98 1.548 1.262c.879.404 1.837.612 2.741.959c.206.08.404.179.579.314c1.292.989.89 2.906-.579 3.472c-1.402.539-2.984.748-4.034 1.909c-.375.415-.634.892-.828 1.414l-.797 2.336c-.322.835-1.097 1.399-2.007 1.347c-.827-.047-1.486-.587-1.779-1.347l-.797-2.336a4.4 4.4 0 0 0-.573-1.102c-.4-.542-.936-.98-1.548-1.262c-.879-.404-1.837-.612-2.741-.959a2.3 2.3 0 0 1-.579-.314c-1.292-.989-.89-2.906.579-3.472c1.402-.539 2.984-.748 4.034-1.909c.375-.415.634-.892.828-1.414l.797-2.336c.322-.835 1.097-1.399 2.007-1.347'
      }
    };
  }
}
</script>
</body>
</html>
