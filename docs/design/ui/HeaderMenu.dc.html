<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tools menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="box-sizing: border-box; padding: {{pad}}; background: {{bg}}; font-family: 'Cascadia Mono', 'Cascadia Code', 'JetBrains Mono', monospace; font-size: 12.5px; color: #d4d4d4">
  <div role="menu" aria-label="Tools" style="width: 290px; background: #131313; border: 1px solid #454545; padding: 4px; box-sizing: border-box">
    <sc-for list="{{items}}" as="m" hint-placeholder-count="8">
      <div role="menuitemcheckbox" aria-checked="{{m.on}}" style="display: flex; align-items: center; gap: 10px; padding: 7px 9px; background: {{m.bg}}; border-left: 2px solid {{m.line}}; color: {{m.fg}}">
        <svg viewBox="0 0 24 24" style="width: 15px; height: 15px; flex-shrink: 0; fill: currentColor" aria-hidden="true"><path d="{{m.icon}}"></path></svg>
        <span style="flex: 1">{{m.t}}</span>
        <span style="color: #8f8f8f; font-size: 11.5px">{{m.k}}</span>
        <svg viewBox="0 0 24 24" style="width: 14px; height: 14px; flex-shrink: 0; fill: {{accent}}" aria-hidden="true"><path d="{{m.check}}"></path></svg>
      </div>
    </sc-for>
    <div style="height: 1px; background: #2b2b2b; margin: 4px 0"></div>
    <div role="menuitemcheckbox" aria-checked="false" style="display: flex; align-items: center; gap: 10px; padding: 8px 9px; background: #1c1c1c; margin-top: 2px">
      <svg viewBox="0 0 24 24" style="width: 15px; height: 15px; flex-shrink: 0; fill: #8f8f8f" aria-hidden="true"><path d="{{ic.sun}}"></path></svg>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="color: #fff">Keep computer awake</span><span style="color: #8f8f8f; font-size: 11px">Only for this session</span></span>
      <span style="width: 30px; height: 16px; background: #2b2b2b; display: flex; padding: 2px; box-sizing: border-box"><span style="width: 12px; height: 12px; background: #8f8f8f"></span></span>
    </div>
  </div>
</div>
</x-dc>

</body>
</html>
