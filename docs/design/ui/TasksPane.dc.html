<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Background tasks pane</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; padding: {{pad}}; background: #000; color: #d4d4d4; font-family: 'Cascadia Mono', 'Cascadia Code', 'JetBrains Mono', monospace; font-size: 13px; display: flex; flex-direction: column; gap: 24px">

<sc-for list="{{panels}}" as="p" hint-placeholder-count="1">
<div style="display: flex; flex-direction: column; gap: 6px">
  <sc-if value="{{all}}" hint-placeholder-val="{{true}}"><div style="font-size: 11px; color: #8f8f8f">{{p.label}}</div></sc-if>
  <section aria-label="Background tasks" style="height: {{p.h}}; display: flex; flex-direction: column; background: #000; border: {{p.frame}}; overflow: hidden">

    <div style="height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 2px; border-bottom: 1px solid #2b2b2b; padding: 0 6px 0 14px">
      <span style="font-family: 'Cascadia Code', monospace; color: #fff; font-size: 13px">Background tasks</span>
      <span style="flex: 1"></span>
      <button aria-label="Clear finished" style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #8f8f8f"><svg viewBox="0 0 24 24" style="width: 15px; height: 15px; fill: currentColor" aria-hidden="true"><path d="{{ic.trash}}"></path></svg></button>
      <button aria-label="Maximize" style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #8f8f8f"><svg viewBox="0 0 24 24" style="width: 15px; height: 15px; fill: currentColor" aria-hidden="true"><path d="{{ic.full}}"></path></svg></button>
      <button aria-label="Close" style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #8f8f8f"><svg viewBox="0 0 24 24" style="width: 15px; height: 15px; fill: currentColor" aria-hidden="true"><path d="{{ic.close}}"></path></svg></button>
    </div>

    <sc-if value="{{p.empty}}" hint-placeholder-val="{{false}}">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; text-align: center">
        <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: #8f8f8f" aria-hidden="true"><path d="{{ic.term}}"></path></svg>
        <span style="color: #fff">No background tasks</span>
        <span style="color: #8f8f8f; font-size: 12px; max-width: 320px; line-height: 1.55">Dev servers, watchers and long test runs the agent starts in the background show up here.</span>
      </div>
    </sc-if>

    <sc-if value="{{p.list}}" hint-placeholder-val="{{true}}">
      <div style="flex: 1; min-height: 0; overflow: hidden; padding: 12px; display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 12px; color: #8f8f8f; padding: 2px 2px 4px">Running <span style="color: #fff">{{runningCount}}</span></div>
        <sc-for list="{{running}}" as="r" hint-placeholder-count="3">
          <div style="border: 1px solid #2b2b2b; background: #0a0a0a">
            <div style="display: flex; align-items: center; gap: 9px; padding: 0 8px 0 10px; height: 38px; font-size: 12.5px">
              <svg viewBox="0 0 24 24" style="width: 12px; height: 12px; flex-shrink: 0; fill: #8f8f8f" aria-hidden="true"><path d="{{r.chev}}"></path></svg>
              <svg viewBox="0 0 24 24" style="width: 13px; height: 13px; flex-shrink: 0; fill: {{accent}}" aria-hidden="true"><path d="{{ic.loading}}"></path></svg>
              <span style="flex: 1; min-width: 0; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.cmd}}</span>
              <span style="color: #8f8f8f; font-size: 11.5px; white-space: nowrap">{{r.t}}</span>
              <button aria-label="Stop" style="width: 24px; height: 24px; flex-shrink: 0; background: #1c1c1c; border: 1px solid #2b2b2b; display: flex; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; background: #fff"></span></button>
            </div>
            <sc-if value="{{r.open}}" hint-placeholder-val="{{false}}">
              <div style="border-top: 1px solid #2b2b2b; padding: 8px 10px 10px 31px; display: flex; flex-direction: column; gap: 6px; font-size: 11.5px">
                <span style="color: #8f8f8f">{{r.meta}}</span>
                <pre style="margin: 0; padding: 6px 8px; background: #000; border: 1px solid #1c1c1c; font-family: inherit; font-size: 11.5px; line-height: 1.6; color: #8f8f8f; white-space: pre-wrap">{{r.tail}}</pre>
                <div style="display: flex; gap: 6px"><button style="background: none; border: 1px solid #2b2b2b; color: #fff; font: inherit; font-size: 11px; padding: 2px 8px">Open in terminal</button><button style="background: none; border: 1px solid #2b2b2b; color: #fff; font: inherit; font-size: 11px; padding: 2px 8px">Send output to chat</button></div>
              </div>
            </sc-if>
          </div>
        </sc-for>

        <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8f8f8f; padding: 14px 2px 4px"><svg viewBox="0 0 24 24" style="width: 11px; height: 11px; fill: currentColor" aria-hidden="true"><path d="{{ic.down}}"></path></svg>Finished <span style="color: #fff">{{finishedCount}}</span></div>
        <sc-for list="{{finished}}" as="f" hint-placeholder-count="6">
          <div style="display: flex; align-items: center; gap: 9px; padding: 0 10px; height: 34px; border: 1px solid #1c1c1c; background: #0a0a0a; font-size: 12.5px">
            <svg viewBox="0 0 24 24" style="width: 12px; height: 12px; flex-shrink: 0; fill: #8f8f8f" aria-hidden="true"><path d="{{ic.right}}"></path></svg>
            <svg viewBox="0 0 24 24" style="width: 13px; height: 13px; flex-shrink: 0; fill: {{f.sc}}" aria-hidden="true"><path d="{{f.icon}}"></path></svg>
            <span style="flex: 1; min-width: 0; color: #d4d4d4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{f.cmd}}</span>
            <span style="color: {{f.ec}}; font-size: 11px; white-space: nowrap">{{f.exit}}</span>
            <span style="color: #8f8f8f; font-size: 11.5px; white-space: nowrap">{{f.t}}</span>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </section>
</div>
</sc-for>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["all","list","empty"],"default":"all"},"height":{"editor":null,"default":"900px"},"framed":{"editor":"boolean","default":true},"accent":{"editor":"color","default":"#2b7fff"},"inset":{"editor":"boolean","default":true},"$preview":{"width":640,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? 'all';
    const all = v === 'all';
    const a = this.props.accent ?? '#2b7fff';
    const ic = {
      trash: 'M13.034 10.741c.226-.842 1.396-.996 1.832-.241c.101.175.121.302.134.5v5c-.03.451-.288.844-.741.966c-.656.176-1.217-.327-1.259-.966v-5Zm-4 0c.226-.842 1.396-.996 1.832-.241c.101.175.121.302.134.5v5c-.03.451-.288.844-.741.966c-.656.176-1.217-.327-1.259-.966v-5ZM19.936 7l-.816 12.238c-.079.749-.384 1.435-.94 1.955s-1.259.778-2.013.807H7.833c-1.058-.041-2.027-.57-2.563-1.499a3.1 3.1 0 0 1-.39-1.263L4.064 7c-.209-.016-.376-.025-.564-.134c-.655-.378-.655-1.354 0-1.732c.175-.101.302-.121.5-.134h3.279l.561-1.683A2.025 2.025 0 0 1 9.668 2h4.664a2.03 2.03 0 0 1 1.828 1.317L16.721 5H20c.198.013.325.033.5.134c.655.378.655 1.354 0 1.732c-.188.109-.355.118-.564.134M6.069 7l.802 12.028c.013.13.025.218.072.337c.161.41.543.619.967.635h8.18c.322-.012.615-.121.82-.38c.139-.175.196-.373.219-.592L17.931 7Zm3.656-2.995L9.387 5h5.226l-.338-.995Z',
      full: 'm5 17.586l4.793-4.793c.409-.359 1.01-.404 1.414 0s.359 1.005 0 1.414L6.414 19H9c1.204.079 1.357 1.672.259 1.966L9 21H4c-.271-.018-.511-.096-.707-.293c-.197-.196-.275-.436-.293-.707v-5l.034-.259C3.328 13.643 4.921 13.796 5 15ZM17.586 5H15c-1.204-.079-1.357-1.672-.259-1.966L15 3h5c.271.018.511.096.707.293c.197.196.275.436.293.707v5l-.034.259c-.294 1.098-1.887.945-1.966-.259V6.414l-4.793 4.793c-.409.359-1.01.404-1.414 0s-.359-1.005 0-1.414Z',
      close: 'M10.586 12.001L4.929 6.344c-.359-.41-.404-1.01 0-1.414c.404-.405 1.005-.359 1.414 0L12 10.586l5.657-5.656c.409-.359 1.01-.404 1.414 0s.359 1.005 0 1.414l-5.657 5.657l5.657 5.656c.359.41.404 1.011 0 1.415s-1.005.359-1.414 0L12 13.415l-5.657 5.657c-.409.359-1.01.404-1.414 0s-.359-1.005 0-1.414Z',
      term: 'M11.741 18.966c-1.098-.294-.945-1.887.259-1.966h8c.543.036 1 .428 1 1s-.457.964-1 1h-8ZM8.586 12l-4.95-4.95c-.574-.654-.22-1.707.707-1.707c.278 0 .503.114.707.293l5.657 5.657c.179.204.293.429.293.707s-.114.503-.293.707L5.05 18.364c-.339.298-.8.394-1.207.159c-.588-.34-.629-1.092-.207-1.573Z',
      loading: 'M2 12c0 5.523 4.477 10 10 10v-2a8 8 0 1 1 0-16a1 1 0 1 0 0-2q-.563 0-1.11.06C5.889 2.615 2 6.853 2 12 M20 12a8 8 0 0 1-8 8v2c5.523 0 10-4.477 10-10a9.97 9.97 0 0 0-2.778-6.917a1 1 0 0 0-1.444 1.384A7.97 7.97 0 0 1 20 12',
      right: 'm13.586 12l-4.95-4.95c-.574-.654-.22-1.707.707-1.707c.278 0 .503.114.707.293l5.657 5.657c.179.204.293.429.293.707s-.114.503-.293.707l-5.657 5.657c-.339.298-.8.394-1.207.159c-.588-.34-.629-1.092-.207-1.573Z',
      down: 'm12 13.586l4.95-4.95c.481-.422 1.233-.381 1.573.207c.235.407.139.868-.159 1.207l-5.657 5.657c-.204.179-.429.293-.707.293s-.503-.114-.707-.293L5.636 10.05c-.179-.204-.293-.429-.293-.707c0-.927 1.053-1.281 1.707-.707Z',
      check: 'M9.171 16.072L19.778 5.465c.409-.359 1.01-.404 1.414 0c.404.405.359 1.005 0 1.415L9.878 18.193c-.204.179-.429.293-.707.293s-.503-.114-.707-.293l-5.657-5.657c-.297-.339-.393-.8-.159-1.207c.34-.588 1.092-.629 1.574-.207Z',
      x: 'M10.586 12.001L4.929 6.344c-.359-.41-.404-1.01 0-1.414c.404-.405 1.005-.359 1.414 0L12 10.586l5.657-5.656c.409-.359 1.01-.404 1.414 0s.359 1.005 0 1.414l-5.657 5.657l5.657 5.656c.359.41.404 1.011 0 1.415s-1.005.359-1.414 0L12 13.415l-5.657 5.657c-.409.359-1.01.404-1.414 0s-.359-1.005 0-1.414Z'
    };
    const R = (cmd, t, open, meta, tail) => ({ cmd, t, open: !!open, chev: open ? ic.down : ic.right, meta: meta ?? '', tail: tail ?? '' });
    const running = [
      R('pnpm --filter core dev', '17m 23s', true, '~/Projects/xlsft/harness · pid 48213 · :3000',
        '➜ Local:   http://localhost:3000/\n✔ Nitro built in 412 ms\nℹ POST /gateway.v1.Gateway/Stream 200 — 3.4s\nℹ POST /gateway.v1.Gateway/Stream 200 — 2.9s'),
      R('docker compose up postgres', '13m 01s'),
      R('go test ./loop -run TestLoop -count=20', '1m 04s'),
      R('pnpm --filter ui dev --port 5173', '6s')
    ];
    const ok = { icon: ic.check, sc: '#00bc7d', exit: '', ec: '#8f8f8f' };
    const bad = (code) => ({ icon: ic.x, sc: '#ff2056', exit: 'exit ' + code, ec: '#ff2056' });
    const F = (cmd, t, st) => ({ cmd, t, ...st });
    const finished = [
      F('pnpm vitest run gateway', '48s', ok),
      F('buf generate', '4s', ok),
      F('go test ./loop', '0.4s', bad(1)),
      F('pnpm lint --fix', '1.2s', ok),
      F('git push origin feat/gateway-stream', '3s', ok),
      F('docker build -t harness-core .', '1m 12s', ok),
      F('pnpm --filter ui build', '22s', bad(2)),
      F('go mod tidy', '2s', ok),
      F('pnpm install --frozen-lockfile', '17s', ok)
    ];
    const h = all ? '600px' : (this.props.height ?? '900px');
    const frame = all || this.props.framed !== false ? '1px solid #2b2b2b' : '0';
    const panels = [
      { key: 'list', label: 'variant="list" · running processes and finished runs', h, frame, list: true, empty: false },
      { key: 'empty', label: 'variant="empty"', h: all ? '320px' : h, frame, list: false, empty: true }
    ].filter((p) => all || p.key === v);
    return {
      accent: a,
      pad: this.props.inset === false ? '0' : '24px',
      all, panels, ic, running, finished,
      runningCount: String(running.length),
      finishedCount: '23'
    };
  }
}
</script>
</body>
</html>
