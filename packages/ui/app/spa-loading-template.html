<!-- Shown by Nuxt until the app mounts (ssr: false): the animated mark in the theme's accent on its background
     (the head script has put the theme's variables on <html> already). -->
<div id="harness-loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--color-ground,#000)">
<svg width="72" height="48" aria-label="Loading harness" role="img" viewBox="0 0 232 155" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
path{fill:var(--color-accent,#2B7FFF);transform-box:fill-box;transform-origin:center}
@keyframes in-a{from{transform:translateX(-22px);opacity:0}}
@keyframes in-t{from{transform:translate(15.5px,-15.5px);opacity:0}}
@keyframes in-b{from{transform:translateX(22px);opacity:0}}
@keyframes rail{0%{fill:var(--color-accent,#2B7FFF)}15%{fill:color-mix(in srgb,var(--color-accent,#2B7FFF) 55%,white)}45%,100%{fill:var(--color-accent,#2B7FFF)}}
.a{animation:in-a .55s cubic-bezier(.2,.8,.2,1) both,rail 1.2s linear 1s infinite}
.t{animation:in-t .55s cubic-bezier(.2,.8,.2,1) .18s both,rail 1.2s linear 1.2s infinite}
.b{animation:in-b .55s cubic-bezier(.2,.8,.2,1) .35s both,rail 1.2s linear 1.4s infinite}
@media (prefers-reduced-motion:reduce){path{animation:none}}
</style>
<path class="a" d="M38.6667 155L116.001 77.5L38.6682 0H0.00151042V38.75L38.6682 77.5L0 116.25V155H38.6667Z"/>
<path class="b" d="M232 116.25L193.333 155L77.3331 155L154.666 77.4999L232 77.5V116.25Z"/>
<path class="t" d="M116 38.75L154.667 6.77526e-06L232 2.03258e-05L154.666 77.4999L116 77.5L116 38.75Z"/>
</svg>
</div>
