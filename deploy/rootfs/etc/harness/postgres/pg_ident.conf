# Image-managed (passed as -c ident_file).
# MAPNAME  SYSTEM-USER  PG-USER
# core runs as the harness OS user.
harness    harness      harness
# The postgres OS user is the superuser and may also act as harness (backups, maintenance).
harness    postgres     postgres
harness    postgres     harness
# `docker exec` runs as root by default: allow `psql -U harness harness` and `psql -U postgres`.
harness    root         harness
harness    root         postgres
